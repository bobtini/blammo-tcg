<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLAMMO TCG</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
  padding: 16px;
}

button, input { font: inherit; }

button {
  border: 0;
  border-radius: 8px;
  padding: 12px 16px;
  background: #ffcf40;
  color: #172033;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

input {
  width: 100%;
  padding: 13px;
  margin-top: 10px;
  border: 1px solid #526078;
  border-radius: 8px;
  background: #101827;
  color: white;
  text-align: center;
  text-transform: uppercase;
}

.panel {
  background: #1d293b;
  max-width: 480px;
  margin: 20px auto;
  padding: 24px;
  border-radius: 16px;
  text-align: center;
  box-shadow: 0 10px 35px #0006;
}

h1 {
  font-size: 46px;
  color: #ffcf40;
  margin: 0;
}

h2 { color: #ffcf40; }

p { color: #cbd5e1; }

#status {
  margin-top: 18px;
  padding: 12px;
  background: #101827;
  border-radius: 8px;
  overflow-wrap: anywhere;
  font-size: 14px;
}

#roomCodeDisplay {
  color: #ffcf40;
  font-size: 30px;
  font-weight: bold;
  letter-spacing: 5px;
  margin-top: 12px;
}

#gameArea {
  max-width: 1100px;
  margin: 25px auto;
  display: none;
}

.game-panel {
  background: #1d293b;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: 0 5px 18px #0005;
}

.player-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.hp {
  color: #ff7777;
  font-weight: bold;
  font-size: 19px;
}

.field {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
  gap: 12px;
  margin-top: 14px;
}

.game-card {
  min-height: 190px;
  border: 3px solid #64748b;
  border-radius: 12px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  background: linear-gradient(145deg, #34445c, #172235);
  box-shadow: 0 5px 12px #0007;
  text-align: center;
}

.game-card.tool {
  border-color: #eab308;
  background: linear-gradient(145deg, #66501a, #30250c);
}

.game-card.boss {
  border-color: #c084fc;
  background: linear-gradient(145deg, #51306e, #21142f);
}

.game-card.selected {
  border-color: #ffcf40;
  box-shadow: 0 0 14px #ffcf4088;
}

.card-name {
  font-size: 16px;
  font-weight: 900;
  min-height: 35px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.card-type {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #cbd5e1;
  margin: 5px 0;
}

.card-stats {
  display: flex;
  justify-content: space-around;
  margin: 8px 0;
}

.stat {
  background: #101827bb;
  border-radius: 7px;
  padding: 6px;
  min-width: 52px;
}

.stat strong {
  display: block;
  font-size: 19px;
  color: #ffcf40;
}

.stat small {
  font-size: 9px;
  color: #cbd5e1;
}

.card-ability {
  font-size: 11px;
  line-height: 1.4;
  background: #101827bb;
  padding: 8px 6px;
  border-radius: 7px;
  flex-grow: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 5px;
}

.card-footer {
  font-size: 10px;
  color: #cbd5e1;
  margin-top: 7px;
}

.section-title {
  margin: 22px 0 12px;
  color: #ffcf40;
  border-bottom: 1px solid #526078;
  padding-bottom: 8px;
}

.hand-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
  gap: 12px;
}

.hand-grid .game-card {
  min-height: 205px;
}

.card-actions {
  display: grid;
  gap: 6px;
  margin-top: 8px;
}

.card-actions button {
  width: 100%;
  padding: 9px 5px;
  font-size: 12px;
}

.secondary {
  background: #526078;
  color: white;
}

.danger {
  background: #b94444;
  color: white;
}

.action-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 14px;
}

.action-row button {
  flex: 1;
  min-width: 130px;
}

.dice {
  font-size: 48px;
  color: #ffcf40;
  font-weight: bold;
  text-align: center;
  margin: 10px;
}

.message {
  background: #101827;
  border-left: 4px solid #ffcf40;
  padding: 13px;
  border-radius: 7px;
  margin: 14px 0;
  overflow-wrap: anywhere;
}

.muted { color: #aab8ca; }

#bossChoices {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
}

#bossChoices button {
  min-height: 80px;
}

.gallery {
  max-width: 1100px;
  margin: 35px auto;
}

.gallery h2 {
  text-align: center;
  color: #ffcf40;
}

.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
  gap: 15px;
}

.gallery .game-card { min-height: 225px; }

.battlefield { position: relative; padding-top: 4px; }
.boss-backdrop { width: 220px; max-width: 90%; min-height: 135px; margin: 0 auto -28px; position: relative; z-index: 1; opacity: .96; }
.field { position: relative; z-index: 2; }
.boss-backdrop .card-ability { min-height: 28px; }

@media(max-width: 450px) {
  body { padding: 9px; }
  .game-panel { padding: 12px; }
  .field { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hand-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>
</head>

<body>

<div class="panel">

<div id="gameArea"></div>

<div class="gallery">

function statusMessage(message) {

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}
