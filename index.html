
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLAMMO TCG</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .panel {
      background: #1d293b;
      width: 100%;
      max-width: 440px;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 35px #0006;
    }

    h1 {
      font-size: 48px;
      color: #ffcf40;
      margin: 0 0 8px;
    }

    p { color: #cbd5e1; }

    button, input {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      background: #ffcf40;
      color: #172033;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    input {
      background: #101827;
      color: white;
      border: 1px solid #526078;
      text-align: center;
      text-transform: uppercase;
    }

    #status {
      margin-top: 20px;
      padding: 12px;
      background: #101827;
      border-radius: 8px;
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    #roomCodeDisplay {
      color: #ffcf40;
      font-size: 32px;
      font-weight: bold;
      letter-spacing: 5px;
    }
  </style>
</head>

<body>
  <div class="panel">
    <h1>BLAMMO</h1>
    <p>Online Trading Card Game</p>

    <button id="connectButton" onclick="connect()">
      Connect
    </button>

    <button id="createButton" onclick="createRoom()" disabled>
      Create Room
    </button>

    <hr style="border-color:#526078; margin-top:24px;">

    <input
      id="roomCode"
      maxlength="6"
      placeholder="ENTER ROOM CODE"
    >

    <button id="joinButton" onclick="joinRoom()" disabled>
      Join Room
    </button>

    <div id="roomCodeDisplay"></div>
    <div id="status">Connect to start playing.</div>
  </div>

  <script>
    // SUPABASE SETTINGS
    const SUPABASE_URL = "https://dpuibiavdodyugyxjihq.supabase.co";
    const SUPABASE_KEY = "PASTE_YOUR_PUBLISHABLE_KEY_HERE";

    // CONNECT TO SUPABASE
    const db = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    let user = null;
    let roomId = null;
    let roomCode = null;
    let seat = null;

    function statusMessage(message) {
      document.getElementById("status").textContent = message;
    }

    async function connect() {
      try {
        statusMessage("Connecting...");

        const { data, error } = await db.auth.signInAnonymously();

        if (error) throw error;

        user = data.user;

        document.getElementById("connectButton").disabled = true;
        document.getElementById("createButton").disabled = false;
        document.getElementById("joinButton").disabled = false;

        statusMessage("Connected! You can create or join a room.");

      } catch (error) {
        statusMessage("Connection error: " + error.message);
      }
    }

    async function createRoom() {
      if (!user) {
        statusMessage("Connect first!");
        return;
      }

      try {
        statusMessage("Creating room...");

        const { data, error } = await db.rpc("create_room");

        if (error) throw error;

        const result = Array.isArray(data) ? data[0] : data;

        if (!result || !result.room_id || !result.room_code) {
          throw new Error("The room function returned unexpected data.");
        }

        roomId = result.room_id;
        roomCode = result.room_code;
        seat = 1;

        document.getElementById("roomCodeDisplay").textContent = roomCode;

        statusMessage("Room created! Give your friend this code: " + roomCode);

      } catch (error) {
        statusMessage("Room error: " + error.message);
      }
    }

    async function joinRoom() {
      if (!user) {
        statusMessage("Connect first!");
        return;
      }

      const code = document.getElementById("roomCode").value.trim().toUpperCase();

      if (!code) {
        statusMessage("Enter a room code.");
        return;
      }

      try {
        statusMessage("Joining room...");

        const { data, error } = await db.rpc("join_room", {
          p_code: code
        });

        if (error) throw error;

        const result = Array.isArray(data) ? data[0] : data;

        if (!result || !result.room_id) {
          throw new Error("The join function returned unexpected data.");
        }

        roomId = result.room_id;
        roomCode = code;
        seat = 2;

        statusMessage("Successfully joined room " + roomCode + "!");

      } catch (error) {
        statusMessage("Join error: " + error.message);
      }
    }
  </script>
</body>
</html>
