
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BLAMMO TCG</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }

:root {
  --gold: #ffcf40;
  --bg: #101827;
  --panel: #1d293b;
  --muted: #aab8ca;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: white;
  font-family: Arial, sans-serif;
  padding: 12px;
}

button, input { font: inherit; }

button {
  border: 0;
  border-radius: 7px;
  padding: 9px 12px;
  background: var(--gold);
  color: #172033;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .4;
  cursor: not-allowed;
}

input {
  width: 100%;
  padding: 13px;
  margin-top: 10px;
  border: 1px solid #526078;
  border-radius: 8px;
  background: var(--bg);
  color: white;
  text-align: center;
  text-transform: uppercase;
}

.panel {
  background: var(--panel);
  max-width: 480px;
  margin: 20px auto;
  padding: 24px;
  border-radius: 16px;
  text-align: center;
  box-shadow: 0 10px 35px #0006;
}

h1 {
  font-size: 46px;
  color: var(--gold);
  margin: 0;
}

h2 { color: var(--gold); }
p { color: #cbd5e1; }

#status {
  margin-top: 18px;
  padding: 12px;
  background: var(--bg);
  border-radius: 8px;
  overflow-wrap: anywhere;
  font-size: 14px;
}

#roomCodeDisplay {
  color: var(--gold);
  font-size: 30px;
  font-weight: bold;
  letter-spacing: 5px;
  margin-top: 12px;
}

.gallery {
  max-width: 1100px;
  margin: 35px auto;
}

.gallery h2 {
  text-align: center;
  color: var(--gold);
}

.section-title {
  color: var(--gold);
  margin-top: 30px;
}

.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
  gap: 15px;
}

/* =====================================
   GAME SCREEN
   ===================================== */

body.in-game {
  padding: 4px;
  height: 100dvh;
  min-height: 0;
  overflow: hidden;
  overscroll-behavior: none;
}

body.in-game > .panel,
body.in-game > .gallery {
  display: none !important;
}

#gameArea { display: none; }

#gameArea.game-screen {
  width: 100%;
  height: calc(100dvh - 8px);
  max-width: 1600px;
  margin: 0 auto;
  display: grid;
  grid-template-rows:
    32px
    minmax(0, 1fr)
    66px
    minmax(0, 1fr)
    minmax(135px, 22vh);
  gap: 6px;
  overflow: hidden;
}

/* TOP BAR */

.topbar {
  background: #1d293b;
  border: 1px solid #526078;
  border-radius: 8px;
  padding: 4px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-width: 0;
  gap: 8px;
  font-size: 12px;
  font-weight: bold;
  white-space: nowrap;
}

.topbar .brand {
  color: var(--gold);
  font-size: 17px;
  letter-spacing: 2px;
}

.topbar .turn-label { color: #69e69b; }

/* PLAYER ZONES */

.player-zone {
  position: relative;
  min-height: 0;
  min-width: 0;
  overflow: hidden;
  background: linear-gradient(145deg, #1d293b, #142033);
  border: 1px solid #526078;
  border-radius: 12px;
  padding: 5px 8px;
  display: flex;
  flex-direction: column;
}

.player-heading {
  position: relative;
  z-index: 4;
  height: 23px;
  min-height: 23px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 12px;
}

.player-heading h2 {
  font-size: 13px;
  margin: 0;
}

.hp {
  color: #ff7777;
  font-weight: bold;
  font-size: 12px;
  text-align: right;
}

/* BATTLEFIELD */

.battlefield {
  position: relative;
  flex: 1;
  min-height: 0;
  min-width: 0;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

.boss-slot {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1;
  pointer-events: none;
}

.field {
  position: relative;
  z-index: 2;
  width: 100%;
  min-width: 0;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 140px));
  justify-content: center;
  align-items: end;
  gap: clamp(4px, 1vw, 12px);
  margin-bottom: 2px;
}

/* CARD WRAPPERS */

.field-card-wrap,
.hand-card-wrap {
  width: 100%;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 3px;
  position: relative;
  z-index: 3;
}

.field-empty {
  grid-column: 1 / -1;
  text-align: center;
  color: var(--muted);
  font-size: 11px;
  padding: 8px;
  background: #101827dd;
  border-radius: 8px;
  align-self: center;
}

/* CARD DESIGN */

.game-card {
  width: 100%;
  height: clamp(88px, 16vh, 145px);
  min-width: 0;
  border: 2px solid #64748b;
  border-radius: 9px;
  padding: 5px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  background: linear-gradient(145deg, #34445c, #172235);
  box-shadow: 0 4px 10px #0008;
  text-align: center;
  overflow: hidden;
}

.game-card.tool {
  border-color: #eab308;
  background: linear-gradient(145deg, #66501a, #30250c);
}

.game-card.boss {
  width: clamp(66px, 9vw, 100px);
  height: clamp(82px, 13vh, 115px);
  border: 2px solid #c084fc;
  background: linear-gradient(145deg, #65418b, #21142f);
  box-shadow: 0 0 16px #c084fc55;
}

.game-card.selected {
  border-color: var(--gold);
  box-shadow: 0 0 14px #ffcf4088;
}

.card-name {
  font-size: clamp(9px, 1vw, 12px);
  font-weight: 900;
  min-height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-wrap: anywhere;
}

.card-type {
  font-size: 7px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #cbd5e1;
  margin: 2px 0;
}

.card-stats {
  display: flex;
  justify-content: space-around;
  gap: 3px;
  margin: 3px 0;
}

.stat {
  background: #101827bb;
  border-radius: 5px;
  padding: 3px;
  min-width: 0;
  flex: 1;
}

.stat strong {
  display: block;
  font-size: clamp(10px, 1.3vw, 15px);
  color: var(--gold);
}

.stat small {
  font-size: 6px;
  color: #cbd5e1;
}

.card-ability {
  font-size: clamp(6px, .7vw, 8px);
  line-height: 1.2;
  background: #101827bb;
  padding: 3px;
  border-radius: 5px;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.card-footer {
  font-size: 6px;
  color: #cbd5e1;
  margin-top: 2px;
}

/* ACTION BUTTONS */

.card-actions {
  display: grid;
  grid-template-columns: 1fr;
  gap: 3px;
  width: 100%;
}

.card-actions button {
  width: 100%;
  min-width: 0;
  padding: 5px 2px;
  font-size: clamp(7px, .75vw, 9px);
  border-radius: 5px;
  white-space: normal;
  line-height: 1.1;
}

.secondary {
  background: #526078;
  color: white;
}

.danger {
  background: #b94444;
  color: white;
}

/* TURN CONTROLS */

.turn-panel {
  background: #25364e;
  border: 1px solid #65758d;
  border-radius: 10px;
  padding: 5px 10px;
  display: grid;
  grid-template-columns: 70px 1fr 1fr 1fr auto;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.dice-box {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  color: var(--gold);
  font-size: 24px;
  font-weight: 900;
}

.turn-stat {
  text-align: center;
  font-size: 9px;
  color: var(--muted);
}

.turn-stat strong {
  display: block;
  color: white;
  font-size: 13px;
  margin-top: 3px;
}

.turn-buttons {
  display: flex;
  gap: 5px;
}

.turn-buttons button {
  white-space: nowrap;
  padding: 8px 10px;
  font-size: 9px;
}

/* HAND */

.hand-panel {
  min-height: 0;
  min-width: 0;
  overflow: hidden;
  background: #1d293b;
  border: 1px solid #526078;
  border-radius: 12px;
  padding: 5px 8px;
  display: flex;
  flex-direction: column;
}

.hand-heading {
  height: 21px;
  min-height: 21px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: var(--gold);
  font-weight: bold;
  font-size: 12px;
}

.hand-grid {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 140px));
  justify-content: center;
  align-items: center;
  gap: clamp(4px, 1vw, 12px);
}

.hand-grid .game-card {
  height: clamp(85px, 15vh, 135px);
}

.hand-empty {
  color: var(--muted);
  text-align: center;
  font-size: 12px;
  grid-column: 1 / -1;
}

/* MESSAGES */

.game-message {
  position: fixed;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  max-width: 90%;
  background: #101827;
  border: 1px solid var(--gold);
  border-radius: 8px;
  padding: 7px 12px;
  font-size: 10px;
  text-align: center;
  box-shadow: 0 4px 15px #0009;
  pointer-events: none;
}

/* BOSS SELECTION */

.boss-selection {
  display: flex !important;
  align-items: center;
  justify-content: center;
  overflow: auto !important;
}

.boss-selection-panel {
  width: min(850px, 95%);
  background: #1d293b;
  border: 1px solid #526078;
  border-radius: 16px;
  padding: 20px;
  text-align: center;
}

.boss-selection-panel h2 {
  color: var(--gold);
  margin-top: 0;
}

.boss-choices {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
  margin-top: 18px;
}

.boss-choice {
  background: #26364d;
  border: 2px solid #64748b;
  border-radius: 12px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.boss-choice .game-card {
  width: 125px;
  height: 155px;
}

.boss-choice button { width: 100%; }
.boss-choice.selected-choice { border-color: var(--gold); }

/* WAITING ROOM */

#gameArea.game-screen.waiting-screen {
  display: flex !important;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: calc(100dvh - 8px);
  max-width: 1500px;
  margin: 0 auto;
  overflow: auto;
}

.waiting-panel {
  width: min(520px, 95%);
  background: #1d293b;
  border: 2px solid #526078;
  border-radius: 16px;
  padding: 25px;
  text-align: center;
  box-shadow: 0 10px 35px #0008;
}

.waiting-panel h2 {
  color: var(--gold);
  font-size: 24px;
  margin-top: 0;
}

.waiting-code {
  background: #101827;
  border: 1px solid var(--gold);
  border-radius: 10px;
  padding: 14px;
  margin: 18px 0;
}

.waiting-code strong {
  display: block;
  color: var(--gold);
  font-size: 32px;
  letter-spacing: 6px;
  margin-bottom: 12px;
}

.player-status {
  background: #101827;
  border-radius: 8px;
  padding: 11px;
  margin: 8px 0;
  color: #cbd5e1;
}

.player-status.connected {
  border: 1px solid #22c55e;
  color: #69e69b;
}

.waiting-spinner {
  width: 30px;
  height: 30px;
  border: 4px solid #526078;
  border-top-color: var(--gold);
  border-radius: 50%;
  margin: 18px auto;
  animation: waitingSpin 1s linear infinite;
}

@keyframes waitingSpin {
  to { transform: rotate(360deg); }
}

/* =====================================
   MOBILE PHONE REDESIGN
   ===================================== */

@media (max-width: 650px) {
  body.in-game {
    padding: 3px;
    height: 100dvh;
    overflow: hidden;
  }

  #gameArea.game-screen {
    height: calc(100dvh - 6px);
    grid-template-rows:
      26px
      minmax(0, 1fr)
      54px
      minmax(0, 1fr)
      minmax(112px, 23vh);
    gap: 4px;
  }

  /* TOP BAR */

  .topbar {
    padding: 2px 6px;
    font-size: 9px;
    border-radius: 6px;
    gap: 3px;
  }

  .topbar .brand {
    font-size: 12px;
    letter-spacing: 1px;
  }

  /* PLAYER AREAS */

  .player-zone {
    padding: 3px;
    border-radius: 8px;
  }

  .player-heading {
    height: 18px;
    min-height: 18px;
    font-size: 9px;
  }

  .player-heading h2 {
    font-size: 10px;
  }

  .hp {
    font-size: 9px;
  }

  /* BATTLEFIELD */

  .battlefield {
    min-height: 0;
    overflow: hidden;
  }

  .boss-slot {
    top: 2px;
  }

  .game-card.boss {
    width: 58px;
    height: 70px;
    padding: 3px;
    border-width: 1px;
    border-radius: 6px;
  }

  /* BODYGUARD SLOTS */

  .field {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 5px;
    padding: 0 2px;
    margin-bottom: 2px;
  }

  .field-card-wrap,
  .hand-card-wrap {
    min-width: 0;
    gap: 3px;
  }

  /* BODYGUARD CARDS */

  .game-card {
    height: clamp(72px, 12vh, 94px);
    padding: 3px;
    border-width: 1px;
    border-radius: 6px;
    box-shadow: 0 2px 5px #0008;
  }

  .card-name {
    font-size: clamp(8px, 2.5vw, 10px);
    min-height: 14px;
    line-height: 1.05;
  }

  .card-type {
    font-size: 5px;
    letter-spacing: .5px;
    margin: 1px 0;
  }

  .card-stats {
    gap: 2px;
    margin: 2px 0;
  }

  .stat {
    padding: 2px 1px;
    border-radius: 3px;
  }

  .stat strong {
    font-size: 10px;
  }

  .stat small {
    font-size: 5px;
  }

  .card-ability {
    font-size: 5.5px;
    line-height: 1.1;
    padding: 2px;
    border-radius: 3px;
  }

  .card-footer {
    font-size: 5px;
  }

  /* CARD BUTTONS */

  .card-actions {
    gap: 2px;
  }

  .card-actions button {
    min-height: 19px;
    padding: 3px 1px;
    font-size: 6.5px;
    line-height: 1;
    border-radius: 4px;
  }

  /* TURN PANEL */

  .turn-panel {
    grid-template-columns: 35px repeat(3, minmax(0, 1fr));
    grid-template-rows: 1fr 1fr;
    gap: 2px;
    padding: 3px;
    border-radius: 7px;
  }

  .dice-box {
    grid-row: 1 / 3;
    font-size: 17px;
  }

  .turn-stat {
    font-size: 6px;
  }

  .turn-stat strong {
    font-size: 9px;
    margin-top: 1px;
  }

  .turn-buttons {
    grid-column: 2 / 5;
    justify-content: center;
    gap: 5px;
  }

  .turn-buttons button {
    padding: 3px 12px;
    font-size: 8px;
    border-radius: 4px;
  }

  /* HAND */

  .hand-panel {
    padding: 3px;
    border-radius: 8px;
  }

  .hand-heading {
    height: 17px;
    min-height: 17px;
    font-size: 9px;
  }

  .hand-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 5px;
    padding: 0 2px;
  }

  .hand-grid .game-card {
    height: clamp(67px, 11vh, 88px);
  }

  /* BOSS SELECTION */

  .boss-selection {
    padding: 5px;
  }

  .boss-selection-panel {
    width: 100%;
    padding: 10px 6px;
    border-radius: 10px;
  }

  .boss-selection-panel h2 {
    font-size: 17px;
  }

  .boss-selection-panel p {
    font-size: 11px;
  }

  .boss-choices {
    gap: 5px;
    margin-top: 10px;
  }

  .boss-choice {
    padding: 5px 3px;
    gap: 5px;
    border-radius: 7px;
  }

  .boss-choice .game-card {
    width: 100%;
    height: 105px;
  }

  .boss-choice button {
    font-size: 7px;
    padding: 5px 2px;
  }

  /* WAITING ROOM */

  #gameArea.game-screen.waiting-screen {
    height: calc(100dvh - 6px);
    padding: 5px;
  }

  .waiting-panel {
    width: 100%;
    padding: 16px 10px;
    border-radius: 12px;
  }

  .waiting-panel h1 {
    font-size: 34px;
  }

  .waiting-panel h2 {
    font-size: 19px;
  }

  .waiting-panel p {
    font-size: 12px;
  }

  .waiting-code strong {
    font-size: 26px;
  }

  /* MESSAGES */

  .game-message {
    bottom: 5px;
    max-width: 94%;
    font-size: 9px;
    padding: 6px 9px;
  }
}

/* SMALL PHONES */

@media (max-width: 380px) {
  .field,
  .hand-grid {
    gap: 3px;
  }

  .game-card {
    padding: 2px;
  }

  .card-name {
    font-size: 8px;
  }

  .card-ability {
    font-size: 5px;
  }

  .card-actions button {
    font-size: 6px;
    padding: 3px 0;
  }

  .topbar {
    font-size: 8px;
  }

  .topbar .brand {
    font-size: 10px;
  }
}

/* SHORT PHONE SCREENS */

@media (max-height: 650px) and (max-width: 650px) {
  #gameArea.game-screen {
    grid-template-rows:
      23px
      minmax(0, 1fr)
      45px
      minmax(0, 1fr)
      100px;
    gap: 3px;
  }

  .game-card {
    height: 68px;
  }

  .game-card.boss {
    height: 58px;
    width: 50px;
  }

  .hand-grid .game-card {
    height: 62px;
  }

  .player-heading {
    height: 15px;
    min-height: 15px;
  }

  .card-actions button {
    min-height: 16px;
    font-size: 6px;
  }

  .turn-panel {
    padding: 2px;
  }
}

/* DESKTOP SHORT SCREENS */

@media (max-height: 600px) and (min-width: 651px) {
  #gameArea.game-screen {
    grid-template-rows: 25px minmax(0, 1fr) 48px minmax(0, 1fr) 105px;
    gap: 3px;
  }

  .player-zone { padding: 2px 5px; }
  .player-heading { height: 17px; min-height: 17px; }
  .game-card { height: clamp(65px, 18vh, 95px); }
  .game-card.boss { height: 68px; width: 58px; }
  .hand-grid .game-card { height: 78px; }
  .card-ability { font-size: 5px; }
  .card-name { font-size: 8px; }
  .card-actions button { padding: 3px 1px; font-size: 6px; }
  .turn-panel { padding: 2px; }
  .turn-buttons button { padding: 3px 6px; font-size: 7px; }
  .hand-heading { height: 15px; min-height: 15px; }
}
</style>

<div class="panel">
  <h1>BLAMMO</h1>
  <p>Online Trading Card Game</p>

  <button id="connectButton" onclick="connect()">Connect</button>
  <button id="createButton" onclick="createRoom()" disabled>Create Room</button>

  <hr style="border-color:#526078;margin-top:24px;">

  <input id="roomCode" maxlength="6" placeholder="ENTER ROOM CODE">
  <button id="joinButton" onclick="joinRoom()" disabled>Join Room</button>

  <div id="roomCodeDisplay"></div>
  <div id="status">Connect to start playing.</div>
</div>

<div id="gameArea"></div>

<div class="gallery">
  <h2>BLAMMO CARD COLLECTION</h2>
  <p style="text-align:center">All cards, stats and abilities</p>
  <div id="cardGallery"></div>
</div>

<script>

let user = null;
let roomCode = null;
let gameView = null;
let selectedAttackerId = null;
let pollTimer = null;
let busy = false;

// =======================================
// CARD COLLECTION

const cards = [

// =======================================
// GENERAL HELPERS
// =======================================

function statusMessage(message) {
  const status = document.getElementById("status");
  if (status) status.textContent = message;
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function getPlayerField(player) {
  if (Array.isArray(player?.field)) return player.field;
  if (Array.isArray(player?.bodyguards)) return player.bodyguards;
  return [];
}

function myPlayer() {
  if (!gameView || !Array.isArray(gameView.players)) return null;
  return gameView.players[gameView.yourSeat - 1];
}

function enemyPlayer() {
  if (!gameView || !Array.isArray(gameView.players)) return null;
  return gameView.players[2 - gameView.yourSeat];
}

function isMyTurn() {
  return gameView &&
    gameView.current === gameView.yourSeat - 1 &&
    !gameView.gameOver;
}

// =======================================
// CONNECT
// =======================================

async function connect() {
  try {
    statusMessage("Connecting...");

    const { data, error } = await db.auth.signInAnonymously();
    if (error) throw error;

    user = data.user;

    document.getElementById("connectButton").disabled = true;
    document.getElementById("createButton").disabled = false;
    document.getElementById("joinButton").disabled = false;

    statusMessage("Connected! Create a room or join your friend's room.");
  } catch (error) {
    statusMessage("Connection error: " + error.message);
  }
}

// =======================================
// CREATE ROOM
// =======================================

async function createRoom() {
  if (!user) return statusMessage("Connect first!");

  try {
    statusMessage("Creating room...");

    const { data, error } = await db.rpc("create_room");
    if (error) throw error;

    const result = Array.isArray(data) ? data[0] : data;

    if (!result || !result.room_id || !result.room_code) {
      throw new Error("Unexpected room response.");
    }

    roomCode = result.room_code;
    document.getElementById("roomCodeDisplay").textContent = roomCode;

    statusMessage("Room created! Give your friend this code: " + roomCode);

    await startGameSession();
  } catch (error) {
    statusMessage("Room error: " + error.message);
  }
}

// =======================================
// JOIN ROOM
// =======================================

async function joinRoom() {
  if (!user) return statusMessage("Connect first!");

  const code = document.getElementById("roomCode").value.trim().toUpperCase();

  if (!code) return statusMessage("Enter a room code.");

  try {
    statusMessage("Joining room...");

    const { data, error } = await db.rpc("join_room", {
      p_code: code
    });

    if (error) throw error;

    const result = Array.isArray(data) ? data[0] : data;

    if (!result || !result.room_id) {
      throw new Error("Unexpected join response.");
    }

    roomCode = code;
    document.getElementById("roomCodeDisplay").textContent = roomCode;

    statusMessage("Successfully joined room " + roomCode + "!");

    await startGameSession();
  } catch (error) {
    statusMessage("Join error: " + error.message);
  }
}

// =======================================
// EDGE FUNCTION CONNECTION
// =======================================

async function gameAction(action, extra = {}) {
  if (!roomCode) throw new Error("You are not in a room.");

  const { data, error } = await db.functions.invoke("blammo-tcg", {
    body: {
      action,
      roomCode,
      ...extra
    }
  });

  if (error) {
    let message = error.message || "Game request failed.";

    try {
      if (error.context && typeof error.context.json === "function") {
        const details = await error.context.json();
        if (details.error) message = details.error;
      }
    } catch (_) {}

    throw new Error(message);
  }

  if (data && data.error) throw new Error(data.error);

  return data;
}

// =======================================
// START GAME SESSION
// =======================================

async function startGameSession() {
  document.body.classList.add("in-game");

  const area = document.getElementById("gameArea");
  area.style.display = "grid";

  await refreshGame();

  if (pollTimer) clearInterval(pollTimer);

  pollTimer = setInterval(async () => {
    if (!busy && roomCode) {
      try {
        await refreshGame();
      } catch (error) {
        console.error("Refresh error:", error);
      }
    }
  }, 2500);
}

async function refreshGame() {
  const result = await gameAction("get_state");
  gameView = result.view;

  if (gameView) renderGame();
}

// =======================================
// BOSS SELECTION
// =======================================

async function chooseBoss(index) {
  if (busy) return;

  try {
    busy = true;
    await gameAction("choose_boss", { bossIndex: index });
    await refreshGame();
  } catch (error) {
    alert(error.message);
  } finally {
    busy = false;
    renderGame();
  }
}

// =======================================
// GAME ACTIONS
// =======================================

async function performAction(action, extra = {}) {
  if (busy) return;

  try {
    busy = true;
    renderGame();

    const result = await gameAction(action, extra);

    if (result.view) {
      gameView = result.view;
      selectedAttackerId = null;
    } else {
      await refreshGame();
    }
  } catch (error) {
    alert(error.message);

    try {
      await refreshGame();
    } catch (_) {}
  } finally {
    busy = false;
    renderGame();
  }
}

function rollDice() {
  performAction("roll");
}

function endTurn() {
  performAction("end_turn");
}

function attackBodyguard(attackerId, targetId) {
  performAction("attack", { attackerId, targetId });
}

function attackBoss(attackerId) {
  performAction("attack", { attackerId });
}

async function playCard(cardId) {
  const me = myPlayer();
  const myField = getPlayerField(me);
  const myVoid = Array.isArray(me?.void) ? me.void : [];
  const card = (me?.hand || []).find(c => c.id === cardId);

  if (!card) return;

  const extra = { cardId };

  if (card.name === "Big Sacrifice") {
    if (!myVoid.length) return alert("Your Void is empty.");

    const options = myVoid
      .map((c, i) => `${i + 1}. ${c.name} (Level ${c.l})`)
      .join("\n");

    const answer = prompt(
      "Choose a Bodyguard from your Void to revive:\n" +
      options +
      "\nEnter its number:"
    );

    const index = Number(answer) - 1;

    if (!Number.isInteger(index) || index < 0 || index >= myVoid.length) return;

    extra.voidCardId = myVoid[index].id;
  }

  if (card.name === "Black Hole") {
    if (!myField.length) return alert("You need a Bodyguard on your field to sacrifice.");

    const options = myField
      .map((c, i) => `${i + 1}. ${c.name} (Level ${c.l})`)
      .join("\n");

    const answer = prompt(
      "Choose a Bodyguard to send to the Void:\n" +
      options +
      "\nEnter its number:"
    );

    const index = Number(answer) - 1;

    if (!Number.isInteger(index) || index < 0 || index >= myField.length) return;

    extra.sacrificeId = myField[index].id;
  }

  performAction("play_card", extra);
}

function useAbility(cardId) {
  performAction("ability", { cardId });
}

function selectAttacker(cardId) {
  selectedAttackerId = selectedAttackerId === cardId ? null : cardId;
  renderGame();
}

// =======================================
// CARD DISPLAY
// =======================================

function makeGameCard(card, options = {}) {
  const element = document.createElement("div");

  element.className = "game-card";

  if (card.t === "Tool") element.classList.add("tool");
  if (options.boss) element.classList.add("boss");
  if (options.selected) element.classList.add("selected");

  const type = options.boss ? "BOSS" : (card.t || "BODYGUARD");
  const power = card.p ?? "—";

  element.innerHTML = `
    <div>
      <div class="card-name">${escapeHtml(card.name)}</div>
      <div class="card-type">${escapeHtml(type)}</div>
    </div>

    <div class="card-stats">
      <div class="stat">
        <strong>${escapeHtml(power)}</strong>
        <small>${options.boss ? "BOSS HP" : "POWER"}</small>
      </div>
      <div class="stat">
        <strong>${escapeHtml(card.l)}</strong>
        <small>LEVEL</small>
      </div>
    </div>

    <div class="card-ability">
      ${escapeHtml(card.a || "No special ability.")}
    </div>

    ${card.turnsLeft !== undefined
      ? `<div class="card-footer">${escapeHtml(card.turnsLeft)} TURNS LEFT</div>`
      : ""}

    ${card.frozen > 0 ? `<div class="card-footer">❄ FROZEN</div>` : ""}
    ${card.used ? `<div class="card-footer">ALREADY USED</div>` : ""}
    ${card.abilityUsedTurn ? `<div class="card-footer">ABILITY USED</div>` : ""}
  `;

  return element;
}

// =======================================
// BOSS CARD
// =======================================

function makeBossCard(boss) {
  boss = boss || {};

  const card = makeGameCard({
    name: boss.name || "Boss",
    p: boss.hp ?? "?",
    l: boss.level ?? "—",
    a: `BOSS • ${boss.hp ?? "?"} HP REMAINING`
  }, { boss: true });

  card.classList.add("boss");
  return card;
}

// =======================================
// CREATE PLAYER ZONE
// =======================================

function createPlayerZone(player, isMine) {
  const zone = document.createElement("section");
  zone.className = "player-zone";

  const heading = document.createElement("div");
  heading.className = "player-heading";

  const boss = player?.boss || {};

  heading.innerHTML = `
    <h2>${isMine ? "YOUR FIELD" : "OPPONENT'S FIELD"}</h2>
    <div class="hp">
      ${escapeHtml(boss.name || "Boss")} · ${escapeHtml(boss.hp ?? "?")} HP
    </div>
  `;

  zone.appendChild(heading);

  const battlefield = document.createElement("div");
  battlefield.className = "battlefield";

  const bossSlot = document.createElement("div");
  bossSlot.className = "boss-slot";
  bossSlot.appendChild(makeBossCard(boss));
  battlefield.appendChild(bossSlot);

  const field = document.createElement("div");
  field.className = "field";

  const bodyguards = getPlayerField(player);

  if (bodyguards.length === 0) {
    const empty = document.createElement("div");
    empty.className = "field-empty";
    empty.textContent = isMine
      ? "Your Bodyguards will appear here."
      : "No enemy Bodyguards.";
    field.appendChild(empty);
  } else {
    bodyguards.forEach(card => {
      const wrapper = document.createElement("div");
      wrapper.className = "field-card-wrap";

      const selected = isMine && selectedAttackerId === card.id;
      const cardElement = makeGameCard(card, { selected });

      wrapper.appendChild(cardElement);

      const actions = document.createElement("div");
      actions.className = "card-actions";

      if (isMine) {
        const selectButton = document.createElement("button");

        selectButton.textContent = selected ? "CANCEL" : "SELECT";
        selectButton.className = "secondary";

        selectButton.disabled =
          !isMyTurn() ||
          !gameView.rolled ||
          card.used ||
          card.frozen > 0 ||
          busy;

        selectButton.onclick = () => selectAttacker(card.id);
        actions.appendChild(selectButton);

        if (["Dirt Golem", "Frankenstein", "Time Machine"].includes(card.name)) {
          const abilityButton = document.createElement("button");

          abilityButton.textContent = "ABILITY";
          abilityButton.className = "secondary";

          abilityButton.disabled =
            !isMyTurn() ||
            !gameView.rolled ||
            card.abilityUsedTurn ||
            card.frozen > 0 ||
            busy;

          abilityButton.onclick = () => useAbility(card.id);
          actions.appendChild(abilityButton);
        }

        const enemyField = getPlayerField(enemyPlayer());

        if (enemyField.length === 0) {
          const bossButton = document.createElement("button");

          bossButton.textContent = "ATTACK BOSS";
          bossButton.disabled =
            !isMyTurn() ||
            !gameView.rolled ||
            card.used ||
            card.frozen > 0 ||
            gameView.round <= 1 ||
            gameView.bossDamageThisTurn >= 1 ||
            busy;

          bossButton.onclick = () => attackBoss(card.id);
          actions.appendChild(bossButton);
        }
      } else if (isMyTurn() && selectedAttackerId) {
        const attackButton = document.createElement("button");

        attackButton.textContent = "ATTACK HERE";
        attackButton.disabled = busy;
        attackButton.onclick = () => attackBodyguard(selectedAttackerId, card.id);

        actions.appendChild(attackButton);
      }

      if (actions.children.length > 0) {
        wrapper.appendChild(actions);
      }

      field.appendChild(wrapper);
    });
  }

  battlefield.appendChild(field);
  zone.appendChild(battlefield);

  return zone;
}

// =======================================
// WAITING ROOM
// =======================================

function renderWaitingRoom(area) {
  area.className = "game-screen waiting-screen";

  const joinedSeats = gameView.joinedSeats || [];
  const playerOneConnected = joinedSeats.includes(1);
  const playerTwoConnected = joinedSeats.includes(2);

  const panel = document.createElement("div");
  panel.className = "waiting-panel";

  panel.innerHTML = `
    <h1>BLAMMO</h1>
    <h2>WAITING FOR PLAYER 2</h2>

    <p>Your room is ready! Share this code with your friend.</p>

    <div class="waiting-code">
      <strong>${escapeHtml(roomCode || "------")}</strong>
      <button id="copyRoomCode">COPY ROOM CODE</button>
    </div>

    <div class="player-status ${playerOneConnected ? "connected" : ""}">
      ${playerOneConnected ? "✓" : "○"} PLAYER 1
      ${playerOneConnected ? "CONNECTED" : "WAITING"}
    </div>

    <div class="player-status ${playerTwoConnected ? "connected" : ""}">
      ${playerTwoConnected ? "✓" : "○"} PLAYER 2
      ${playerTwoConnected ? "CONNECTED" : "WAITING"}
    </div>

    <div class="waiting-spinner"></div>

    <p>Boss selection will begin automatically when both players are connected.</p>
  `;

  area.appendChild(panel);

  panel.querySelector("#copyRoomCode").onclick = async () => {
    try {
      await navigator.clipboard.writeText(roomCode);
      panel.querySelector("#copyRoomCode").textContent = "COPIED!";
    } catch (error) {
      alert("Your room code is: " + roomCode);
    }
  };
}

// =======================================
// RENDER GAME
// =======================================

function renderGame() {
  const area = document.getElementById("gameArea");

  if (!gameView) return;

  area.innerHTML = "";

  if (
    !gameView.started &&
    Number(gameView.playersJoined || 0) < 2
  ) {
    renderWaitingRoom(area);
    return;
  }

  if (!gameView.started) {
    renderBossSelection(area);
    return;
  }

  area.className = "game-screen";

  const me = myPlayer();
  const enemy = enemyPlayer();

  if (!me || !enemy) {
    area.textContent = "Waiting for player data...";
    return;
  }

  const myTurn = isMyTurn();

  // TOP BAR

  const topbar = document.createElement("div");
  topbar.className = "topbar";

  topbar.innerHTML = `
    <span class="brand">BLAMMO</span>
    <span>ROOM ${escapeHtml(roomCode)}</span>
    <span>ROUND ${escapeHtml(gameView.round)}</span>
    <span class="turn-label">
      ${gameView.gameOver
        ? "GAME OVER"
        : myTurn ? "YOUR TURN" : "OPPONENT'S TURN"}
    </span>
  `;

  area.appendChild(topbar);

  // OPPONENT'S FIELD

  area.appendChild(createPlayerZone(enemy, false));

  // TURN CONTROLS

  const turnPanel = document.createElement("div");
  turnPanel.className = "turn-panel";

  turnPanel.innerHTML = `
    <div class="dice-box">
      🎲 ${gameView.rolled ? escapeHtml(gameView.rollValue) : "?"}
    </div>

    <div class="turn-stat">
      LEVEL USED
      <strong>${escapeHtml(gameView.spentThisTurn)} / ${escapeHtml(gameView.rollValue)}</strong>
    </div>

    <div class="turn-stat">
      PLAYS LEFT
      <strong>${escapeHtml(gameView.playsLeft)} / 2</strong>
    </div>

    <div class="turn-stat">
      BOSS DAMAGE
      <strong>${escapeHtml(gameView.bossDamageThisTurn)} / 1</strong>
    </div>

    <div class="turn-buttons">
      <button id="rollButton">ROLL</button>
      <button id="endTurnButton" class="secondary">END TURN</button>
    </div>
  `;

  area.appendChild(turnPanel);

  document.getElementById("rollButton").onclick = rollDice;
  document.getElementById("endTurnButton").onclick = endTurn;

  document.getElementById("rollButton").disabled =
    !myTurn || gameView.rolled || busy;

  document.getElementById("endTurnButton").disabled =
    !myTurn || !gameView.rolled || busy;

  // YOUR FIELD

  area.appendChild(createPlayerZone(me, true));

  // YOUR HAND

  const handPanel = document.createElement("section");
  handPanel.className = "hand-panel";

  const handHeading = document.createElement("div");
  handHeading.className = "hand-heading";

  handHeading.innerHTML = `
    <span>YOUR HAND</span>
    <span>${(me.hand || []).length} / 3 CARDS</span>
  `;

  handPanel.appendChild(handHeading);

  const handGrid = document.createElement("div");
  handGrid.className = "hand-grid";

  const myField = getPlayerField(me);
  const myVoid = Array.isArray(me.void) ? me.void : [];

  (me.hand || []).forEach(card => {
    const wrapper = document.createElement("div");
    wrapper.className = "hand-card-wrap";

    const cardElement = makeGameCard(card);
    const actions = document.createElement("div");
    actions.className = "card-actions";

    const playButton = document.createElement("button");
    playButton.textContent = card.t === "Tool" ? "USE TOOL" : "PLAY";

    playButton.disabled =
      !myTurn ||
      !gameView.rolled ||
      gameView.playsLeft <= 0 ||
      (card.t !== "Tool" && myField.length >= 3) ||
      gameView.spentThisTurn + card.l > gameView.rollValue ||
      (card.name === "Big Sacrifice" &&
        (myVoid.length === 0 || myField.length >= 3)) ||
      (card.name === "Black Hole" && myField.length === 0) ||
      busy;

    playButton.onclick = () => playCard(card.id);

    actions.appendChild(playButton);
    wrapper.appendChild(cardElement);
    wrapper.appendChild(actions);
    handGrid.appendChild(wrapper);
  });

  if (!me.hand || me.hand.length === 0) {
    const empty = document.createElement("div");
    empty.className = "hand-empty";
    empty.textContent = "Your hand is empty.";
    handGrid.appendChild(empty);
  }

  handPanel.appendChild(handGrid);
  area.appendChild(handPanel);

  // GAME MESSAGE

  if (gameView.message) {
    const message = document.createElement("div");
    message.className = "game-message";
    message.textContent = gameView.message;
    area.appendChild(message);
  }

  // GAME OVER

  if (gameView.gameOver) {
    const message = document.createElement("div");
    message.className = "game-message";
    message.textContent = `🏆 ${gameView.winner} WINS!`;
    area.appendChild(message);
  }
}

// BOSS SELECTION SCREEN
// =======================================

function renderBossSelection(area) {
  area.className = "game-screen boss-selection";

  const chosen = gameView.choices || {};
  const myChoice = chosen[String(gameView.yourSeat)];

  const panel = document.createElement("div");
  panel.className = "boss-selection-panel";

  panel.innerHTML = `
    <h2>CHOOSE YOUR BOSS</h2>
    <p>Choose your Boss before the battle begins.</p>
    <div class="boss-choices" id="bossChoices"></div>
    <div class="message" id="bossStatus">
      ${myChoice !== undefined
        ? "You have selected your Boss. Waiting for the other player..."
        : "Choose your Boss below."}
    </div>
  `;

  area.appendChild(panel);

  const choices = panel.querySelector("#bossChoices");

  bosses.forEach((boss, index) => {
    const choice = document.createElement("div");
    choice.className = "boss-choice";

    if (myChoice === index) choice.classList.add("selected-choice");

    const bossCard = makeGameCard({
      name: boss[0],
      p: boss[1],
      l: boss[1],
      a: "Starts with 6 Boss HP."
    }, { boss: true });

    choice.appendChild(bossCard);

    const button = document.createElement("button");

    button.textContent =
      myChoice === index ? "SELECTED" : "CHOOSE BOSS";

    button.disabled = myChoice !== undefined || busy;
    button.onclick = () => chooseBoss(index);

    choice.appendChild(button);
    choices.appendChild(choice);
  });
}

  bosses.forEach(b => {
    bossGrid.appendChild(
      makeGalleryCard(b[0], null, b[1], "Starts with 6 Boss HP.", "Boss")
    );
  });

  bossSection.appendChild(bossGrid);

  gallery.replaceChildren(bodySection, toolSection, bossSection);
}

renderGallery();
</script>
