<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLAMMO TCG</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --ink:#17202a; --gold:#f3c969; --gold-deep:#a97827; --felt:#174b3b;
  --felt-dark:#0c2e26; --cream:#f4ead3; --paper:#fff8e9; --muted:#d6dfd8;
  --panel:#172c29; --line:rgba(243,201,105,.48); --red:#b94b4b;
}
*{box-sizing:border-box}
html{min-height:100%;background:#101b1a}
body{margin:0;min-height:100vh;padding:22px;color:#f8f2e4;font-family:Georgia,'Times New Roman',serif;background:radial-gradient(ellipse at 50% 0%,#285d49 0,#153c31 44%,#0b211d 100%);}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.13;background-image:repeating-linear-gradient(0deg,transparent 0 5px,rgba(255,255,255,.035) 6px),repeating-linear-gradient(90deg,transparent 0 7px,rgba(0,0,0,.04) 8px);z-index:0}
body>*{position:relative;z-index:1}
button,input{font:inherit}
button{border:1px solid #ffe4a0;border-radius:9px;padding:11px 16px;background:linear-gradient(180deg,#ffe49a,#dcae4e);color:#2b2110;font-weight:900;letter-spacing:.03em;cursor:pointer;box-shadow:0 3px 0 #805b23,0 6px 12px #0005;transition:transform .12s,filter .12s}
button:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}
button:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #805b23}
button:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
button:focus-visible,input:focus-visible{outline:3px solid #fff1b8;outline-offset:3px}
input{width:100%;padding:14px;margin-top:10px;border:1px solid #bba879;border-radius:9px;background:#10251f;color:#fff;text-align:center;text-transform:uppercase;letter-spacing:.18em}
.panel{max-width:510px;margin:18px auto 28px;padding:28px;border:2px solid var(--gold-deep);border-radius:18px;text-align:center;background:linear-gradient(145deg,#243d35,#122721);box-shadow:0 14px 40px #0008,inset 0 0 0 4px #ffffff08}
h1{font-family:Georgia,serif;font-size:clamp(42px,8vw,60px);letter-spacing:.12em;color:#ffe09a;text-shadow:0 3px 0 #805b23,0 7px 18px #0009;margin:0}
h2{color:#ffe09a;letter-spacing:.07em;text-shadow:0 2px 6px #0008}
p{color:#d8e4da;line-height:1.5}
#status{margin-top:18px;padding:13px;background:#0d211c;border:1px solid #456b58;border-radius:9px;overflow-wrap:anywhere;font:14px/1.5 Arial,sans-serif;color:#e5eee7}
#roomCodeDisplay{color:#ffe09a;font:900 32px Arial,sans-serif;letter-spacing:7px;margin-top:12px}
#gameArea{max-width:1450px;margin:24px auto;display:none}
.game-panel{background:linear-gradient(145deg,rgba(25,57,46,.97),rgba(12,37,30,.97));border:1px solid var(--line);border-radius:15px;padding:19px;margin-bottom:17px;box-shadow:0 8px 22px #0006,inset 0 1px #ffffff0d}
.player-heading{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hp{color:#ffaaa0;font:bold 20px Arial,sans-serif;text-shadow:0 2px 5px #0008}
.section-title{margin:20px 0 12px;color:#ffe09a;border-bottom:1px solid var(--line);padding-bottom:9px;letter-spacing:.06em}
.field{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-top:16px;position:relative;z-index:2;align-items:start}
.battlefield{position:relative;padding:8px 10px 12px;border:1px solid #a8c5a14a;border-radius:13px;background:linear-gradient(135deg,#1d6048aa,#0c3329cc);box-shadow:inset 0 0 24px #061b1555}
.boss-backdrop{width:240px;max-width:90%;min-height:0;margin:0 auto -6px;position:relative;z-index:1;opacity:1}
.game-card{position:relative;min-width:0;width:100%;min-height:285px;height:auto;align-self:start;padding:12px;border:4px solid #c69b4c;border-radius:14px;display:flex;flex-direction:column;justify-content:flex-start;gap:9px;background:linear-gradient(145deg,#f8edcf,#dfc99b 62%,#c9ae78);color:#241d12;box-shadow:0 7px 14px #0008,inset 0 0 0 2px #fff9,inset 0 0 16px #77511d38;text-align:center;overflow:visible}
.game-card:before{content:"";position:absolute;inset:5px;border:1px solid #9a7138;border-radius:8px;pointer-events:none}
.game-card.tool{border-color:#e1b83e;background:linear-gradient(145deg,#fff1ad,#e7c86d 65%,#b99035)}
.game-card.boss{border-color:#b78ad9;background:linear-gradient(145deg,#e8d8f6,#b99acb 65%,#806092);min-height:160px}
.game-card.selected{border-color:#fff16b;box-shadow:0 0 0 3px #fff16b,0 0 24px #ffdf57b8}
.card-name{font:bold clamp(16px,1.3vw,19px)/1.18 Georgia,serif;min-height:42px;display:flex;align-items:center;justify-content:center;overflow-wrap:anywhere;word-break:normal;padding:3px 7px;border-bottom:2px solid #9c753d;color:#2d2112;text-shadow:0 1px #fff9}
.card-type{font:900 10px/1.3 Arial,sans-serif;text-transform:uppercase;letter-spacing:1.4px;color:#6b542d;margin:0}
.card-stats{display:flex;justify-content:space-evenly;gap:8px;margin:0}
.stat{flex:1;background:linear-gradient(180deg,#493a26,#211b14);border:1px solid #d3b16d;border-radius:8px;padding:7px;color:#fff1cf;box-shadow:inset 0 1px #fff3}
.stat strong{display:block;font:bold 22px Arial,sans-serif;color:#ffe18a}
.stat small{font:900 9px Arial,sans-serif;color:#ead9b5;letter-spacing:1px}
.card-ability{font:600 13px/1.5 Arial,sans-serif;background:#fff9e9;border:1px solid #b69a68;border-radius:8px;padding:11px 10px;color:#302719;flex:0 0 auto;min-width:0;width:100%;min-height:66px;height:auto;max-height:none;display:block;position:relative;z-index:1;text-align:left;overflow:visible;white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal;margin-top:0;line-clamp:unset;-webkit-line-clamp:unset;-webkit-box-orient:initial}
.card-footer{font:900 9px/1.3 Arial,sans-serif;letter-spacing:1px;color:#70572f;margin-top:0;text-transform:uppercase}
.boss-backdrop .card-ability{min-height:34px;text-align:center}
.hand-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:17px;align-items:start}
.hand-grid .game-card{min-height:310px;height:auto}
.card-actions{display:grid;gap:7px;margin-top:10px}
.card-actions button{width:100%;padding:10px 7px;font:900 11px Arial,sans-serif;white-space:normal;line-height:1.25}
.secondary{background:linear-gradient(180deg,#607b70,#344e44);border-color:#a9c5b4;color:white;box-shadow:0 3px 0 #1b3029,0 5px 10px #0005}
.danger{background:linear-gradient(180deg,#d66a61,#9f3434);border-color:#f0a19a;color:white;box-shadow:0 3px 0 #662323,0 5px 10px #0005}
.action-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:15px}
.action-row button{flex:1;min-width:140px}
.dice{font:900 52px Arial,sans-serif;color:#ffe09a;text-align:center;margin:10px;text-shadow:0 5px 12px #0008}
.message{background:#0d211c;border:1px solid #456b58;border-left:5px solid #f3c969;padding:13px;border-radius:8px;margin:14px 0;overflow-wrap:anywhere;color:#f4ead3;line-height:1.5}
.muted{color:#c3d5c9}
#bossChoices{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
#bossChoices button{min-height:90px;font-size:16px}
.gallery{max-width:1450px;margin:38px auto}
.gallery h2{text-align:center;color:#ffe09a}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:17px;align-items:start}
.gallery .game-card{min-height:300px}
.gallery .game-card .card-ability{font-size:13px}
@media(min-width:1000px){.field{grid-template-columns:repeat(3,minmax(0,1fr))}.hand-grid{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}}
@media(max-width:700px){body{padding:10px}.panel{padding:20px 16px}.game-panel{padding:13px}.field{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.game-card{min-height:0;padding:9px;border-width:3px}.hand-grid{grid-template-columns:minmax(0,1fr);gap:12px}.hand-grid .game-card{min-height:0;height:auto}.card-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.gallery .game-card{min-height:0}.card-name{font-size:15px}.card-ability{font-size:13px;padding:10px;line-height:1.5}.stat strong{font-size:19px}.boss-backdrop{width:210px}.hp{font-size:17px}}
@media(max-width:390px){.field,.hand-grid,.card-grid{grid-template-columns:minmax(0,1fr)}.game-card,.hand-grid .game-card,.gallery .game-card{min-height:0}.card-ability{font-size:13px}.action-row button{min-width:100%}}

</style>
</head>

<body>

<div class="panel">
  <h1>BLAMMO</h1>
  <p>Online Trading Card Game</p>

  <button id="connectButton" onclick="connect()">Connect</button>
  <button id="createButton" onclick="createRoom()" disabled>Create Room</button>

  <hr style="border-color:#526078;margin-top:24px;">

  <input id="roomCode" maxlength="6" placeholder="ENTER ROOM CODE">
  <button id="joinButton" onclick="joinRoom()" disabled>Join Room</button>

  <div id="roomCodeDisplay"></div>
  <div id="status">Connect to start playing.</div>
</div>

<div id="gameArea"></div>

<div class="gallery">
  <h2>BLAMMO CARD COLLECTION</h2>
  <p style="text-align:center">All cards, stats and abilities</p>
  <div id="cardGallery"></div>
</div>

<script>
// =======================================
// SUPABASE SETTINGS
// =======================================

const SUPABASE_URL = "https://dpuibiavdodyugyxjihq.supabase.co";
const SUPABASE_KEY = "sb_publishable_Iycq9Dnx8tGSWvHpiUMI1A_rdpwzxem";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let user = null;
let roomCode = null;
let gameView = null;
let selectedAttackerId = null;
let pollTimer = null;
let busy = false;

// =======================================
// CARD COLLECTION
// =======================================

const cards = [
["Joe the Fish",125,1,"No special ability."],
["Dan the Mouse",10,1,"No special ability."],
["Crud",120,1,"No special ability."],
["Jim the Special Unicorn",100,1,"No special ability."],
["King Jim",140,2,"On death: summon Peasant Boy."],
["Ice Golem",240,4,"On play: freeze an enemy Bodyguard for 1 turn."],
["Dirt J.R",250,5,"On death: summon Dirt Golem."],
["Flame J.R",170,3,"On death: summon Fire Golem."],
["Tim the Rat",125,1,"No special ability."],
["Big Sacrifice",null,4,"Lose 1 Boss HP to play a card from your Void for free."],
["Electro J.R",150,3,"On death: summon Electric Golem."],
["Ice J.R",200,4,"On death: summon Ice Golem."],
["Peasant Boy",125,1,"No special ability."],
["Water Golem",175,4,"On death: destroy the Bodyguard that killed it."],
["Dragone",200,3,"On death: give one of your Bodyguards +50 Power for 1 turn."],
["Pedro",130,1,"No special ability."],
["Fire Golem",200,4,"On death: roll; if even, Void the weakest enemy Bodyguard."],
["Black Hole",null,2,"Void one of your Bodyguards and summon a card of the same Level."],
["Dirt Golem",310,5,"Once per turn: roll; on a 1, Void the weakest enemy Bodyguard."],
["Electric Golem",230,3,"On death: opponent's next roll gets -1."],
["Glubinator",300,6,"+50 Power for each Glub in your Void."],
["Uncle Terry",null,3,"On play: roll; Power becomes 50 × the result."],
["Elemental Sword",null,5,"Destroy all Elemental cards in play."],
["Dice Ghost",200,4,"On death: may use opponent's last dice roll next turn."],
["Rich Boy",120,2,"On play: summon Butler."],
["Element Machine",null,3,"Roll; if even, your Elementals gain +100 Power permanently."],
["Butler",275,4,"Only played when summoned by Rich Boy."],
["Wind Golem",190,4,"On death: opponent's next roll gets -2."],
["Lucky Dice",null,2,"Your next dice roll gets +2."],
["Frankenstein",145,2,"Once per turn: inspect the top card of your deck."],
["Krud",100,1,"No special ability."],
["Glub",null,1,"On play: Power becomes 30 × the result."],
["Time Machine",145,3,"Once per turn: force your opponent to reroll their next dice roll."],
["Doggo",350,6,"No special ability."]
];

const bosses = [
["Hotdog Boss",8,"Boss"],
["Element Overlord",6,"Boss"],
["Ultimate Guard",5,"Boss"]
];

// =======================================
// GENERAL HELPERS
// =======================================

function statusMessage(message) {
  document.getElementById("status").textContent = message;
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function myPlayer() {
  if (!gameView) return null;
  return gameView.players[gameView.yourSeat - 1];
}

function enemyPlayer() {
  if (!gameView) return null;
  return gameView.players[2 - gameView.yourSeat];
}

function isMyTurn() {
  return gameView &&
    gameView.current === gameView.yourSeat - 1 &&
    !gameView.gameOver;
}

function setButtonsDisabled(disabled) {
  document.querySelectorAll("#gameArea button").forEach(button => {
    button.disabled = disabled || button.dataset.locked === "true";
  });
}

// =======================================
// CONNECT
// =======================================

async function connect() {
  try {
    statusMessage("Connecting...");

    const { data, error } = await db.auth.signInAnonymously();

    if (error) throw error;

    user = data.user;

    document.getElementById("connectButton").disabled = true;
    document.getElementById("createButton").disabled = false;
    document.getElementById("joinButton").disabled = false;

    statusMessage("Connected! Create a room or join your friend's room.");
  } catch (error) {
    statusMessage("Connection error: " + error.message);
  }
}

// =======================================
// CREATE ROOM
// =======================================

async function createRoom() {
  if (!user) return statusMessage("Connect first!");

  try {
    statusMessage("Creating room...");

    const { data, error } = await db.rpc("create_room");
    if (error) throw error;

    const result = Array.isArray(data) ? data[0] : data;

    if (!result || !result.room_id || !result.room_code) {
      throw new Error("Unexpected room response.");
    }

    roomCode = result.room_code;

    document.getElementById("roomCodeDisplay").textContent = roomCode;

    statusMessage("Room created! Give your friend this code: " + roomCode);

    await startGameSession();
  } catch (error) {
    statusMessage("Room error: " + error.message);
  }
}

// =======================================
// JOIN ROOM
// =======================================

async function joinRoom() {
  if (!user) return statusMessage("Connect first!");

  const code = document.getElementById("roomCode").value.trim().toUpperCase();

  if (!code) return statusMessage("Enter a room code.");

  try {
    statusMessage("Joining room...");

    const { data, error } = await db.rpc("join_room", {
      p_code: code
    });

    if (error) throw error;

    const result = Array.isArray(data) ? data[0] : data;

    if (!result || !result.room_id) {
      throw new Error("Unexpected join response.");
    }

    roomCode = code;

    document.getElementById("roomCodeDisplay").textContent = roomCode;

    statusMessage("Successfully joined room " + roomCode + "!");

    await startGameSession();
  } catch (error) {
    statusMessage("Join error: " + error.message);
  }
}

// =======================================
// EDGE FUNCTION CONNECTION
// =======================================

async function gameAction(action, extra = {}) {
  if (!roomCode) throw new Error("You are not in a room.");

  const { data, error } = await db.functions.invoke("blammo-tcg", {
    body: {
      action,
      roomCode,
      ...extra
    }
  });

  if (error) {
    let message = error.message || "Game request failed.";

    try {
      if (error.context && typeof error.context.json === "function") {
        const details = await error.context.json();
        if (details.error) message = details.error;
      }
    } catch (_) {}

    throw new Error(message);
  }

  if (data && data.error) {
    throw new Error(data.error);
  }

  return data;
}

// =======================================
// START GAME SESSION
// =======================================

async function startGameSession() {
  document.getElementById("gameArea").style.display = "block";

  await refreshGame();

  if (pollTimer) clearInterval(pollTimer);

  pollTimer = setInterval(async () => {
    if (!busy && roomCode) {
      try {
        await refreshGame();
      } catch (error) {
        console.error("Refresh error:", error);
      }
    }
  }, 2500);
}

async function refreshGame() {
  const result = await gameAction("get_state");

  gameView = result.view;

  if (gameView) {
    renderGame();
  }
}

// =======================================
// BOSS SELECTION
// =======================================

async function chooseBoss(index) {
  if (busy) return;

  try {
    busy = true;
    statusMessage("Choosing Boss...");

    await gameAction("choose_boss", {
      bossIndex: index
    });

    await refreshGame();
    statusMessage("Boss selected.");
  } catch (error) {
    statusMessage(error.message);
  } finally {
    busy = false;
  }
}

// =======================================
// GAME ACTIONS
// =======================================

async function performAction(action, extra = {}) {
  if (busy) return;

  try {
    busy = true;
    setButtonsDisabled(true);

    const result = await gameAction(action, extra);

    if (result.view) {
      gameView = result.view;
      selectedAttackerId = null;
      renderGame();
    } else {
      await refreshGame();
    }

    statusMessage("Move completed.");
  } catch (error) {
    statusMessage(error.message);

    try {
      await refreshGame();
    } catch (_) {}
  } finally {
    busy = false;
    setButtonsDisabled(false);
    renderGame();
  }
}

function rollDice() {
  performAction("roll");
}

function endTurn() {
  performAction("end_turn");
}

function playCard(cardId) {
  performAction("play_card", { cardId });
}

function attackBodyguard(attackerId, targetId) {
  performAction("attack", {
    attackerId,
    targetId
  });
}

function attackBoss(attackerId) {
  performAction("attack", {
    attackerId
  });
}

async function playCard(cardId) {
  const me = myPlayer();
  const card = (me?.hand || []).find(c => c.id === cardId);
  if (!card) return;
  const extra = { cardId };
  if (card.name === "Big Sacrifice") {
    if (!me.void.length) return statusMessage("Your Void is empty.");
    const options = me.void.map((c, i) => `${i + 1}. ${c.name} (Level ${c.l})`).join("\n");
    const answer = prompt("Choose a Bodyguard from your Void to revive:\n" + options + "\nEnter its number:");
    const index = Number(answer) - 1;
    if (!Number.isInteger(index) || index < 0 || index >= me.void.length) return;
    extra.voidCardId = me.void[index].id;
  }
  if (card.name === "Black Hole") {
    if (!me.field.length) return statusMessage("You need a Bodyguard on your field to sacrifice.");
    const options = me.field.map((c, i) => `${i + 1}. ${c.name} (Level ${c.l})`).join("\n");
    const answer = prompt("Choose a Bodyguard to send to the Void:\n" + options + "\nEnter its number:");
    const index = Number(answer) - 1;
    if (!Number.isInteger(index) || index < 0 || index >= me.field.length) return;
    extra.sacrificeId = me.field[index].id;
  }
  performAction("play_card", extra);
}

function useAbility(cardId) {
  performAction("ability", { cardId });
}

function selectAttacker(cardId) {
  selectedAttackerId =
    selectedAttackerId === cardId ? null : cardId;

  renderGame();
}

// =======================================
// CARD DISPLAY
// =======================================

function makeGameCard(card, options = {}) {
  const element = document.createElement("div");

  element.className = "game-card";

  if (card.t === "Tool") element.classList.add("tool");
  if (options.boss) element.classList.add("boss", "boss-backdrop");
  if (options.selected) element.classList.add("selected");

  const type = card.t || card.type || "Bodyguard";
  const power = card.p ?? card.power ?? "—";
  const abilityText = card.a ?? card.ability ?? card.effect ?? card.description ?? "No special ability.";

  const frozen = card.frozen > 0
    ? `<div class="card-footer">FROZEN</div>`
    : "";

  const used = card.used
    ? `<div class="card-footer">ALREADY USED</div>`
    : "";
  const abilityUsed = card.abilityUsedTurn
    ? `<div class="card-footer">ABILITY USED THIS TURN</div>`
    : "";

  const turns = card.turnsLeft !== undefined
    ? `<div class="card-footer">${escapeHtml(card.turnsLeft)} TURNS LEFT</div>`
    : "";

  element.innerHTML = `
    <div>
      <div class="card-name">${escapeHtml(card.name)}</div>
      <div class="card-type">${escapeHtml(type)}</div>
    </div>

    <div class="card-stats">
      <div class="stat">
        <strong>${escapeHtml(power)}</strong>
        <small>POWER</small>
      </div>

      <div class="stat">
        <strong>${escapeHtml(card.l ?? card.level ?? "—")}</strong>
        <small>LEVEL</small>
      </div>
    </div>

    <div class="card-ability">
      ${escapeHtml(abilityText)}
    </div>

    ${turns}
    ${frozen}
    ${used}
    ${abilityUsed}

    <div class="card-footer">BLAMMO TCG</div>
  `;

  return element;
}

// =======================================
// RENDER GAME
// =======================================

function renderGame() {
  const area = document.getElementById("gameArea");

  if (!gameView) return;

  if (!gameView.started) {
    renderBossSelection(area);
    return;
  }

  const me = myPlayer();
  const enemy = enemyPlayer();
  const myTurn = isMyTurn();

  area.innerHTML = "";

  // GAME HEADER
  const header = document.createElement("div");
  header.className = "game-panel";

  header.innerHTML = `
    <h2 style="text-align:center">BLAMMO BATTLE</h2>

    <div class="player-heading">
      <strong>ROOM: ${escapeHtml(roomCode)}</strong>
      <strong>ROUND ${escapeHtml(gameView.round)}</strong>
    </div>

    <div class="message">
      ${escapeHtml(gameView.message || "Game in progress.")}
    </div>

    <div style="text-align:center">
      ${
        gameView.gameOver
          ? `<h2>GAME OVER — ${escapeHtml(gameView.winner)} WINS!</h2>`
          : myTurn
            ? `<h2 style="color:#69e69b">YOUR TURN</h2>`
            : `<h2 style="color:#fca5a5">OPPONENT'S TURN</h2>`
      }
    </div>
  `;

  area.appendChild(header);

  // ENEMY
  const enemyPanel = document.createElement("div");
  enemyPanel.className = "game-panel";

  enemyPanel.innerHTML = `
    <div class="player-heading">
      <h2>OPPONENT</h2>
      <div class="hp">${escapeHtml(enemy.boss.name)}: ${escapeHtml(enemy.boss.hp)} HP</div>
    </div>

    <div class="muted">Opponent's deck: ${escapeHtml(enemy.deckCount)} cards</div>

    <h3 class="section-title">OPPONENT'S BODYGUARDS</h3>
  `;

  const enemyBattlefield = document.createElement("div");
  enemyBattlefield.className = "battlefield";
  const enemyBossCard = makeGameCard({ name: enemy.boss.name, p: enemy.boss.level, l: enemy.boss.level, a: `BOSS • ${enemy.boss.hp} HP` }, { boss: true });
  enemyBattlefield.appendChild(enemyBossCard);

  const enemyField = document.createElement("div");
  enemyField.className = "field";

  if (enemy.field.length === 0) {
    enemyField.innerHTML = '<p class="muted">No Bodyguards on the field.</p>';
  } else {
    enemy.field.forEach(card => {
      const cardElement = makeGameCard(card);

      if (myTurn && selectedAttackerId) {
        const attackButton = document.createElement("button");
        attackButton.textContent = "Attack this Bodyguard";

        attackButton.onclick = () => {
          attackBodyguard(selectedAttackerId, card.id);
        };

        cardElement.appendChild(attackButton);
      }

      enemyField.appendChild(cardElement);
    });
  }

  enemyBattlefield.appendChild(enemyField);
  enemyPanel.appendChild(enemyBattlefield);
  area.appendChild(enemyPanel);

  // TURN PANEL
  const turnPanel = document.createElement("div");
  turnPanel.className = "game-panel";

  turnPanel.innerHTML = `
    <h2 style="text-align:center">YOUR TURN STATUS</h2>

    <div class="dice">
      ${gameView.rolled ? "🎲 " + escapeHtml(gameView.rollValue) : "🎲 ?"}
    </div>

    <p style="text-align:center">
      Level used: ${escapeHtml(gameView.spentThisTurn)}
      /
      ${escapeHtml(gameView.rollValue)}
    </p>

    <p style="text-align:center">
      Cards remaining this turn: ${escapeHtml(gameView.playsLeft)}
      / 2
    </p>

    <p style="text-align:center">
      Boss damage this turn: ${escapeHtml(gameView.bossDamageThisTurn)} / 1
    </p>

    <div class="action-row">
      <button id="rollButton">ROLL DICE</button>
      <button id="endTurnButton" class="secondary">END TURN</button>
    </div>
  `;

  area.appendChild(turnPanel);

  document.getElementById("rollButton").onclick = rollDice;
  document.getElementById("endTurnButton").onclick = endTurn;

  document.getElementById("rollButton").disabled =
    !myTurn || gameView.rolled || busy;

  document.getElementById("endTurnButton").disabled =
    !myTurn || !gameView.rolled || busy;

  // YOUR FIELD
  const myFieldPanel = document.createElement("div");
  myFieldPanel.className = "game-panel";

  myFieldPanel.innerHTML = `
    <div class="player-heading">
      <h2>YOUR FIELD</h2>
      <div class="hp">${escapeHtml(me.boss.name)}: ${escapeHtml(me.boss.hp)} HP</div>
    </div>

    <p class="muted">Your Bodyguards: ${me.field.length} / 3</p>
  `;

  const myBattlefield = document.createElement("div");
  myBattlefield.className = "battlefield";
  const myBossCard = makeGameCard({ name: me.boss.name, p: me.boss.level, l: me.boss.level, a: `BOSS • ${me.boss.hp} HP` }, { boss: true });
  myBattlefield.appendChild(myBossCard);

  const myField = document.createElement("div");
  myField.className = "field";

  if (me.field.length === 0) {
    myField.innerHTML = '<p class="muted">You have no Bodyguards on the field.</p>';
  } else {
    me.field.forEach(card => {
      const selected = selectedAttackerId === card.id;
      const cardElement = makeGameCard(card, { selected });

      const actions = document.createElement("div");
      actions.className = "card-actions";

      const selectButton = document.createElement("button");
      selectButton.textContent = selected
        ? "Cancel selection"
        : "Select attacker";

      selectButton.className = "secondary";

      selectButton.disabled =
        !myTurn ||
        !gameView.rolled ||
        card.used ||
        card.frozen > 0 ||
        busy;

      selectButton.onclick = () => selectAttacker(card.id);

      actions.appendChild(selectButton);

      if (["Dirt Golem", "Frankenstein", "Time Machine"].includes(card.name)) {
        const abilityButton = document.createElement("button");
        abilityButton.textContent = "USE ABILITY";
        abilityButton.className = "secondary";
        abilityButton.disabled = !myTurn || !gameView.rolled || card.abilityUsedTurn || card.frozen > 0 || busy;
        abilityButton.onclick = () => useAbility(card.id);
        actions.appendChild(abilityButton);
      }

      if (enemy.field.length === 0) {
        const bossButton = document.createElement("button");
        bossButton.textContent = "Attack Boss";

        bossButton.disabled =
          !myTurn ||
          !gameView.rolled ||
          card.used ||
          card.frozen > 0 ||
          gameView.round <= 1 ||
          gameView.bossDamageThisTurn >= 1 ||
          busy;

        bossButton.onclick = () => attackBoss(card.id);

        actions.appendChild(bossButton);
      }

      cardElement.appendChild(actions);
      myField.appendChild(cardElement);
    });
  }

  myBattlefield.appendChild(myField);
  myFieldPanel.appendChild(myBattlefield);
  area.appendChild(myFieldPanel);

  // YOUR HAND
  const handPanel = document.createElement("div");
  handPanel.className = "game-panel";

  handPanel.innerHTML = `
    <h2>YOUR HAND</h2>
    <p class="muted">
      Playing a Bodyguard or Tool uses one of your two plays. Tools activate immediately.
    </p>
  `;

  const handGrid = document.createElement("div");
  handGrid.className = "hand-grid";

  (me.hand || []).forEach(card => {
    const cardElement = makeGameCard(card);
    const actions = document.createElement("div");
    actions.className = "card-actions";

    const playButton = document.createElement("button");

    playButton.textContent = card.t === "Tool" ? "USE TOOL" : "PLAY BODYGUARD";
    playButton.disabled =
      !myTurn ||
      !gameView.rolled ||
      gameView.playsLeft <= 0 ||
      (card.t !== "Tool" && me.field.length >= 3) ||
      gameView.spentThisTurn + card.l > gameView.rollValue ||
      (card.name === "Big Sacrifice" && (!me.void || me.void.length === 0 || me.field.length >= 3)) ||
      (card.name === "Black Hole" && me.field.length === 0) ||
      busy;
    playButton.onclick = () => playCard(card.id);

    actions.appendChild(playButton);
    cardElement.appendChild(actions);
    handGrid.appendChild(cardElement);
  });

  if (!me.hand || me.hand.length === 0) {
    handGrid.innerHTML = '<p class="muted">Your hand is empty.</p>';
  }

  handPanel.appendChild(handGrid);
  area.appendChild(handPanel);

  // VOID AND DECK
  const extraPanel = document.createElement("div");
  extraPanel.className = "game-panel";

  extraPanel.innerHTML = `
    <h3>YOUR DECK</h3>
    <p>${escapeHtml(me.deckCount)} cards remaining</p>

    <h3>YOUR VOID</h3>
    <p>${me.void.length ? me.void.map(c => escapeHtml(c.name)).join(", ") : "Your Void is empty."}</p>
    ${me.peekedCard ? `<p class="message">Frankenstein saw: ${escapeHtml(me.peekedCard.name)} (Level ${escapeHtml(me.peekedCard.l)}, Power ${escapeHtml(me.peekedCard.p ?? "—")})</p>` : ""}
  `;

  area.appendChild(extraPanel);

  if (gameView.gameOver) {
    const winnerPanel = document.createElement("div");
    winnerPanel.className = "game-panel";
    winnerPanel.innerHTML = `
      <h2 style="text-align:center">
        🏆 ${escapeHtml(gameView.winner)} WINS!
      </h2>
    `;
    area.appendChild(winnerPanel);
  }
}

// =======================================
// BOSS SELECTION SCREEN
// =======================================

function renderBossSelection(area) {
  const chosen = gameView.choices || {};
  const myChoice = chosen[String(gameView.yourSeat)];

  area.innerHTML = `
    <div class="game-panel">
      <h2 style="text-align:center">CHOOSE YOUR BOSS</h2>
      <p style="text-align:center">
        Both players must select a Boss before the battle begins.
      </p>

      <div id="bossChoices"></div>

      <div class="message" id="bossStatus">
        ${
          myChoice !== undefined
            ? "You have selected your Boss. Waiting for the other player..."
            : "Choose your Boss below."
        }
      </div>
    </div>
  `;

  const choices = document.getElementById("bossChoices");

  bosses.forEach((boss, index) => {
    const button = document.createElement("button");

    button.innerHTML = `
      ${escapeHtml(boss[0])}
      <br>
      <small>Level ${escapeHtml(boss[1])} · 6 HP</small>
    `;

    if (myChoice !== undefined) {
      button.disabled = true;

      if (myChoice === index) {
        button.textContent = boss[0] + " — SELECTED";
      }
    }

    button.onclick = () => chooseBoss(index);

    choices.appendChild(button);
  });
}

// =======================================
// CARD GALLERY
// =======================================

function makeGalleryCard(name, power, level, ability, type = "Bodyguard") {
  const card = document.createElement("div");

  card.className = "game-card";

  if (type === "Tool") card.classList.add("tool");
  if (type === "Boss") card.classList.add("boss");

  card.innerHTML = `
    <div>
      <div class="card-name">${escapeHtml(name)}</div>
      <div class="card-type">${escapeHtml(type)}</div>
    </div>

    <div class="card-stats">
      <div class="stat">
        <strong>${power === null ? "—" : escapeHtml(power)}</strong>
        <small>${type === "Boss" ? "BOSS" : "POWER"}</small>
      </div>

      <div class="stat">
        <strong>${escapeHtml(level)}</strong>
        <small>LEVEL</small>
      </div>
    </div>

    <div class="card-ability">${escapeHtml(ability)}</div>
    <div class="card-footer">BLAMMO TCG</div>
  `;

  return card;
}

function renderGallery() {
  const gallery = document.getElementById("cardGallery");

  const bodyguards = cards.filter(c => c[1] !== null);
  const tools = cards.filter(c => c[1] === null);

  const bodySection = document.createElement("section");
  bodySection.innerHTML = '<h3 class="section-title">BODYGUARDS</h3>';

  const bodyGrid = document.createElement("div");
  bodyGrid.className = "card-grid";

  bodyguards.forEach(c => {
    bodyGrid.appendChild(
      makeGalleryCard(c[0], c[1], c[2], c[3])
    );
  });

  bodySection.appendChild(bodyGrid);

  const toolSection = document.createElement("section");
  toolSection.innerHTML = '<h3 class="section-title">TOOLS</h3>';

  const toolGrid = document.createElement("div");
  toolGrid.className = "card-grid";

  tools.forEach(c => {
    toolGrid.appendChild(
      makeGalleryCard(c[0], c[1], c[2], c[3], "Tool")
    );
  });

  toolSection.appendChild(toolGrid);

  const bossSection = document.createElement("section");
  bossSection.innerHTML = '<h3 class="section-title">BOSSES</h3>';

  const bossGrid = document.createElement("div");
  bossGrid.className = "card-grid";

  bosses.forEach(b => {
    bossGrid.appendChild(
      makeGalleryCard(
        b[0],
        null,
        b[1],
        "Starts with 6 Boss HP.",
        "Boss"
      )
    );
  });

  bossSection.appendChild(bossGrid);

  gallery.replaceChildren(bodySection, toolSection, bossSection);
}

renderGallery();
</script>

</body>
</html>
