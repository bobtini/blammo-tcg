<head>

<style>
:root {
  --bg: #080b20;
  --panel: rgba(18, 22, 53, .88);
  --panel2: rgba(25, 30, 72, .92);
  --line: #4541a8;
  --purple: #9b5cff;
  --purple2: #6d4aff;
  --blue: #36cfff;
  --cyan: #72edff;
  --text: #f3f2ff;
  --muted: #b7bbdf;
  --glow: rgba(107, 80, 255, .32);
}
* { box-sizing: border-box; }
html { min-height: 100%; background: var(--bg); }
body {
  margin: 0; min-height: 100vh; padding: 18px;
  color: var(--text); font-family: Inter, Arial, sans-serif;
  background:
    radial-gradient(ellipse at 12% 0%, rgba(111, 58, 255, .28), transparent 38%),
    radial-gradient(ellipse at 90% 15%, rgba(0, 174, 255, .18), transparent 34%),
    linear-gradient(145deg, #080b20 0%, #101034 48%, #080d25 100%);
  background-attachment: fixed;
}
button, input { font: inherit; }
button {
  border: 1px solid rgba(135, 116, 255, .75); border-radius: 9px;
  padding: 11px 15px; color: white; font-weight: 800; cursor: pointer;
  background: linear-gradient(110deg, #7045e8, #286bdc 85%);
  box-shadow: 0 0 15px rgba(102, 79, 255, .22), inset 0 1px rgba(255,255,255,.16);
  transition: transform .15s ease, filter .15s ease, box-shadow .15s ease;
}
button:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.13); box-shadow: 0 0 20px rgba(70, 190, 255, .28); }
button:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
input {
  width: 100%; padding: 13px; margin-top: 10px; border: 1px solid #5554b4;
  border-radius: 9px; background: #0b102b; color: white; text-align: center;
  text-transform: uppercase; outline: none; box-shadow: inset 0 0 12px #050817;
}
input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(54,207,255,.14); }
.panel {
  max-width: 500px; margin: 20px auto; padding: 25px; border-radius: 18px;
  text-align: center; background: linear-gradient(145deg, rgba(28,30,78,.96), rgba(13,19,51,.96));
  border: 1px solid #5145b8; box-shadow: 0 14px 45px #0008, 0 0 25px var(--glow);
}
h1 { margin: 0; font-size: clamp(38px, 7vw, 56px); font-weight: 1000; letter-spacing: 5px;
  color: #fff; text-shadow: 0 0 9px var(--purple), 0 0 25px #5865ff, 0 0 40px #238bff; }
h2, .gallery h2 { color: var(--cyan); text-shadow: 0 0 12px rgba(54,207,255,.28); }
p { color: var(--muted); }
#status { margin-top: 18px; padding: 12px; background: #0a102b; border: 1px solid #343a82; border-radius: 8px; overflow-wrap: anywhere; font-size: 14px; }
#roomCodeDisplay { color: var(--cyan); font-size: 30px; font-weight: 900; letter-spacing: 5px; margin-top: 12px; text-shadow: 0 0 14px #249bff; }
#gameArea { max-width: 1180px; margin: 25px auto; display: none; }
.game-panel {
  min-width: 0; background: linear-gradient(145deg, rgba(23,27,72,.96), rgba(12,18,49,.96));
  border: 1px solid #4644a4; border-radius: 14px; padding: 17px; margin-bottom: 15px;
  box-shadow: 0 8px 25px #0006, inset 0 1px rgba(255,255,255,.035);
}
.player-heading { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.hp { color: #ff83c9; font-weight: 900; font-size: 18px; }
.field { display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); gap: 10px; margin-top: 12px; align-items: start; }
.game-card {
  min-width: 0; min-height: 0; height: auto; padding: 9px; gap: 5px;
  display: flex; flex-direction: column; justify-content: flex-start; text-align: center;
  border: 1.5px solid #6560db; border-radius: 11px;
  background: linear-gradient(155deg, rgba(54,48,126,.98), rgba(14,32,79,.98) 72%, rgba(11,47,83,.98));
  box-shadow: 0 5px 15px #0007, 0 0 11px rgba(91,90,255,.13), inset 0 1px rgba(255,255,255,.12);
  overflow: visible;
}
.game-card.tool { border-color: #31c9ed; background: linear-gradient(145deg, #174f87, #18245f 78%); box-shadow: 0 0 13px rgba(42,200,255,.17); }
.game-card.boss { border-color: #bd73ff; background: linear-gradient(145deg, #632e9e, #231c65 75%); box-shadow: 0 0 16px rgba(164,87,255,.22); }
.game-card.selected { border-color: #70efff; box-shadow: 0 0 0 2px rgba(76,221,255,.28), 0 0 20px rgba(54,207,255,.42); }
.card-name { min-height: 0; font-size: clamp(12px, 1.15vw, 15px); line-height: 1.2; font-weight: 900; display: flex; align-items: center; justify-content: center; overflow-wrap: anywhere; }
.card-type { font-size: 9px; text-transform: uppercase; letter-spacing: 1.1px; color: #c8d6ff; margin: 3px 0; }
.card-stats { display: flex; justify-content: space-around; gap: 5px; margin: 4px 0; }
.stat { min-width: 0; flex: 1 1 0; padding: 5px 4px; border: 1px solid rgba(105,135,255,.28); border-radius: 7px; background: rgba(5,10,35,.62); }
.stat strong { display: block; font-size: 17px; color: #78eaff; text-shadow: 0 0 9px rgba(54,207,255,.35); }
.stat small { font-size: 8px; color: #c3c9f1; }
.card-ability {
  display: block; flex: 0 0 auto; width: 100%; min-width: 0; min-height: 0; height: auto; max-height: none;
  padding: 7px; margin-top: 3px; border: 1px solid rgba(107,125,225,.28); border-radius: 7px;
  background: rgba(5,10,34,.68); color: #e4e9ff; font-size: 10.5px; line-height: 1.35;
  text-align: left; white-space: normal; overflow: visible; overflow-wrap: anywhere; word-break: normal;
}
.card-footer { font-size: 8px; color: #aeb8e8; margin-top: 3px; letter-spacing: .7px; }
.section-title { margin: 20px 0 11px; color: #9fefff; border-bottom: 1px solid #464b9d; padding-bottom: 8px; }
.hand-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); gap: 9px; align-items: start; }
.hand-grid .game-card, .gallery .game-card { min-height: 0; height: auto; }
.card-actions { display: grid; gap: 5px; margin-top: 6px; }
.card-actions button { width: 100%; padding: 7px 5px; font-size: 10px; white-space: normal; }
.secondary { background: linear-gradient(110deg, #414b91, #245d9b); border-color: #627bd5; color: white; }
.danger { background: linear-gradient(110deg, #a83275, #742c9c); color: white; }
.action-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.action-row button { flex: 1; min-width: 130px; }
.dice { font-size: 46px; color: var(--cyan); font-weight: 900; text-align: center; margin: 10px; text-shadow: 0 0 18px #3e8eff; }
.message { background: #0b1232; border: 1px solid #343c8d; border-left: 4px solid var(--blue); padding: 12px; border-radius: 7px; margin: 13px 0; overflow-wrap: anywhere; }
.muted { color: #aeb9df; }
#bossChoices { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
#bossChoices button { min-height: 75px; }
.gallery { max-width: 1180px; margin: 35px auto; }
.gallery h2 { text-align: center; }
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 10px; align-items: start; }
.battlefield { position: relative; padding-top: 4px; }
.boss-backdrop { width: 205px; max-width: 90%; min-height: 0; margin: 0 auto -20px; position: relative; z-index: 1; opacity: .98; }
.field { position: relative; z-index: 2; }
.boss-backdrop .card-ability { min-height: 0; }
@media (min-width: 900px) { .field { grid-template-columns: repeat(3, minmax(0, 1fr)); } .hand-grid { grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); } }
@media (max-width: 650px) {
  body { padding: 9px; }
  .panel { padding: 18px 14px; }
  .game-panel { padding: 11px; }
  .field, .hand-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .game-card { padding: 7px; border-width: 1.5px; }
  .card-name { font-size: 12px; }
  .card-ability { font-size: 10px; line-height: 1.34; padding: 6px 5px; }
  .boss-backdrop { width: 175px; margin-bottom: -16px; }
  .card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
}
@media (max-width: 350px) { .field, .hand-grid, .card-grid { grid-template-columns: minmax(0, 1fr); } }

/* SINGLE-SCREEN BATTLE BOARD */
html, body { min-height: 100%; }
body { padding: 10px; }
#gameArea { width: min(1500px, 100%); max-width: none; margin: 8px auto 0; }
.game-board {
  height: calc(100dvh - 20px);
  min-height: 540px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr) minmax(0, 1.15fr);
  gap: 9px;
  overflow: hidden;
}
.game-board > .game-panel {
  min-width: 0; min-height: 0; margin: 0; padding: 10px;
  overflow: hidden; border-radius: 12px;
}
.game-board > .board-header { grid-column: 1 / -1; }
.game-board > .enemy-panel { grid-column: 1; grid-row: 2; }
.game-board > .turn-panel { grid-column: 2; grid-row: 2; }
.game-board > .my-field-panel { grid-column: 1; grid-row: 3; }
.game-board > .hand-panel { grid-column: 2; grid-row: 3; }
.game-board > .board-extra { display: none; }
.game-board > .game-panel:not(.board-header):not(.enemy-panel):not(.turn-panel):not(.my-field-panel):not(.hand-panel):not(.board-extra) { grid-column: 1 / -1; }
.game-board .section-title { margin: 8px 0 6px; padding-bottom: 5px; }
.game-board .field { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 6px; }
.game-board .hand-grid { grid-template-columns: repeat(auto-fit, minmax(105px, 1fr)); gap: 6px; }
.game-board .game-card { padding: 6px; gap: 3px; border-radius: 8px; }
.game-board .card-name { font-size: 11px; }
.game-board .card-type, .game-board .card-footer { font-size: 7px; }
.game-board .card-stats { margin: 2px 0; gap: 3px; }
.game-board .stat { padding: 3px 2px; }
.game-board .stat strong { font-size: 13px; }
.game-board .stat small { font-size: 7px; }
.game-board .card-ability { padding: 4px; margin-top: 2px; font-size: 9px; line-height: 1.2; }
.game-board .card-actions { gap: 3px; margin-top: 3px; }
.game-board .card-actions button { padding: 5px 3px; font-size: 9px; }
.game-board .boss-backdrop { width: 145px; margin-bottom: -12px; }
.game-board .dice { font-size: 36px; margin: 5px; }
.game-board .action-row { gap: 6px; margin-top: 8px; }
.game-board .action-row button { min-width: 90px; padding: 8px; }
.game-board .message { margin: 7px 0; padding: 7px; font-size: 12px; }
.game-board .muted, .game-board p { font-size: 11px; margin: 5px 0; }
body:has(.game-board) { overflow: hidden; }
body:has(.game-board) > .panel, body:has(.game-board) > .gallery { display: none; }
@media (max-width: 760px) {
  body { padding: 6px; }
  #gameArea { margin: 0 auto; }
  .game-board {
    height: calc(100dvh - 12px); min-height: 0;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) minmax(0, 1.1fr);
    gap: 5px;
  }
  .game-board > .game-panel { padding: 6px; }
  .game-board h2 { font-size: 14px; margin: 3px 0; }
  .game-board .player-heading { gap: 4px; }
  .game-board .hp { font-size: 12px; }
  .game-board .field { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
  .game-board .hand-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
  .game-board .card-ability { font-size: 8px; padding: 3px; }
  .game-board .card-name { font-size: 10px; }
  .game-board .boss-backdrop { width: 110px; margin-bottom: -8px; }
  .game-board .dice { font-size: 26px; }
  .game-board .action-row { flex-direction: column; }
  .game-board .action-row button { width: 100%; }
}
</style>

<body>

<div class="panel">
  <h1>BLAMMO</h1>
  <p>Online Trading Card Game</p>

  <button id="connectButton" onclick="connect()">Connect</button>
  <button id="createButton" onclick="createRoom()" disabled>Create Room</button>

  <hr style="border-color:#526078;margin-top:24px;">

  <input id="roomCode" maxlength="6" placeholder="ENTER ROOM CODE">
  <button id="joinButton" onclick="joinRoom()" disabled>Join Room</button>

  <div id="roomCodeDisplay"></div>
  <div id="status">Connect to start playing.</div>
</div>

<div id="gameArea"></div>

<div class="gallery">
  <h2>BLAMMO CARD COLLECTION</h2>
  <p style="text-align:center">All cards, stats and abilities</p>
  <div id="cardGallery"></div>
</div>

<script>
// =======================================
// SUPABASE SETTINGS
// =======================================

const SUPABASE_URL = "https://dpuibiavdodyugyxjihq.supabase.co";
const SUPABASE_KEY = "sb_publishable_Iycq9Dnx8tGSWvHpiUMI1A_rdpwzxem";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let user = null;
let roomCode = null;
let gameView = null;
let selectedAttackerId = null;
let pollTimer = null;
let busy = false;

// =======================================
// CARD COLLECTION
// =======================================

const cards = [
["Joe the Fish",125,1,"No special ability."],
["Dan the Mouse",10,1,"No special ability."],
["Crud",120,1,"No special ability."],
["Jim the Special Unicorn",100,1,"No special ability."],
["King Jim",140,2,"On death: summon Peasant Boy."],
["Ice Golem",240,4,"On play: freeze an enemy Bodyguard for 1 turn."],
["Dirt J.R",250,5,"On death: summon Dirt Golem."],
["Flame J.R",170,3,"On death: summon Fire Golem."],
["Tim the Rat",125,1,"No special ability."],
["Big Sacrifice",null,4,"Lose 1 Boss HP to play a card from your Void for free."],
["Electro J.R",150,3,"On death: summon Electric Golem."],
["Ice J.R",200,4,"On death: summon Ice Golem."],
["Peasant Boy",125,1,"No special ability."],
["Water Golem",175,4,"On death: destroy the Bodyguard that killed it."],
["Dragone",200,3,"On death: give one of your Bodyguards +50 Power for 1 turn."],
["Pedro",130,1,"No special ability."],
["Fire Golem",200,4,"On death: roll; if even, Void the weakest enemy Bodyguard."],
["Black Hole",null,2,"Void one of your Bodyguards and summon a card of the same Level."],
["Dirt Golem",310,5,"Once per turn: roll; on a 1, Void the weakest enemy Bodyguard."],
["Electric Golem",230,3,"On death: opponent's next roll gets -1."],
["Glubinator",300,6,"+50 Power for each Glub in your Void."],
["Uncle Terry",null,3,"On play: roll; Power becomes 50 × the result."],
["Elemental Sword",null,5,"Destroy all Elemental cards in play."],
["Dice Ghost",200,4,"On death: may use opponent's last dice roll next turn."],
["Rich Boy",120,2,"On play: summon Butler."],
["Element Machine",null,3,"Roll; if even, your Elementals gain +100 Power permanently."],
["Butler",275,4,"Only played when summoned by Rich Boy."],
["Wind Golem",190,4,"On death: opponent's next roll gets -2."],
["Lucky Dice",null,2,"Your next dice roll gets +2."],
["Frankenstein",145,2,"Once per turn: inspect the top card of your deck."],
["Krud",100,1,"No special ability."],
["Glub",null,1,"On play: Power becomes 30 × the result."],
["Time Machine",145,3,"Once per turn: force your opponent to reroll their next dice roll."],
["Doggo",350,6,"No special ability."]
];

const bosses = [
["Hotdog Boss",8,"Boss"],
["Element Overlord",6,"Boss"],
["Ultimate Guard",5,"Boss"]
];

// =======================================
// GENERAL HELPERS
// =======================================

function statusMessage(message) {
  document.getElementById("status").textContent = message;
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function myPlayer() {
  return gameView.players[gameView.yourSeat - 1];
}

function enemyPlayer() {
  return gameView.players[2 - gameView.yourSeat];
}

function isMyTurn() {
  return gameView &&
    !gameView.gameOver &&
    gameView.currentTurn === gameView.yourSeat;
}

// =======================================
// CONNECT AND ROOM MANAGEMENT
// =======================================

async function connect() {
  statusMessage("Connecting...");

  const { data, error } = await db.auth.signInAnonymously();

  if (error) {
    statusMessage(error.message);
    return;
  }

  user = data.user;

  document.getElementById("connectButton").disabled = true;
  document.getElementById("createButton").disabled = false;
  document.getElementById("joinButton").disabled = false;

  statusMessage("Connected! Create a room or join a room.");
}

async function createRoom() {
  if (!user) return statusMessage("Connect first.");

  statusMessage("Creating room...");

  const { data, error } = await db.rpc("create_room");

  if (error) {
    statusMessage(error.message);
    return;
  }

  roomCode = data;
  document.getElementById("roomCodeDisplay").textContent = roomCode;

  await enterRoom(roomCode);
}

async function joinRoom() {
  if (!user) return statusMessage("Connect first.");

  const code = document.getElementById("roomCode").value.trim().toUpperCase();

  if (!code) return statusMessage("Enter a room code.");

  statusMessage("Joining room...");

  const { data, error } = await db.rpc("join_room", {
    p_code: code
  });

  if (error) {
    statusMessage(error.message);
    return;
  }

  roomCode = code;
  document.getElementById("roomCodeDisplay").textContent = roomCode;

  await enterRoom(roomCode);
}

async function enterRoom(code) {
  document.getElementById("gameArea").style.display = "block";
  document.querySelector(".panel").style.display = "none";

  await refreshGame();

  if (pollTimer) clearInterval(pollTimer);

  pollTimer = setInterval(refreshGame, 2500);
}

// =======================================
// GAME STATE
// =======================================

async function refreshGame() {
  if (!roomCode) return;

  const { data, error } = await db.functions.invoke("blammo-tcg", {
    body: {
      action: "get_state",
      roomCode
    }
  });

  if (error) {
    statusMessage(error.message);
    return;
  }

  gameView = data;
  renderGame();
}

async function performAction(action, extra = {}) {
  if (busy) return;

  busy = true;
  renderGame();

  try {
    const { data, error } = await db.functions.invoke("blammo-tcg", {
      body: {
        action,
        roomCode,
        ...extra
      }
    });

    if (error) throw error;

    gameView = data;
  } catch (error) {
    statusMessage(error.message || "Action failed.");
  } finally {
    busy = false;
    if (gameView) renderGame();
  }
}

// =======================================
// GAME ACTIONS
// =======================================

async function chooseBoss(name) {
  await performAction("choose_boss", { bossName: name });
}

async function rollDice() {
  await performAction("roll");
}

async function endTurn() {
  selectedAttackerId = null;
  await performAction("end_turn");
}

async function attackBodyguard(attackerId, targetId) {
  selectedAttackerId = null;
  await performAction("attack", {
    attackerId,
    targetId
  });
}

async function attackBoss(attackerId) {
  selectedAttackerId = null;
  await performAction("attack", {
    attackerId,
    targetBoss: true
  });
}

function selectAttacker(id) {
  selectedAttackerId = selectedAttackerId === id ? null : id;
  renderGame();
}

async function playCard(cardId) {
  const me = myPlayer();
  const card = me.hand.find(c => c.id === cardId);

  if (!card) return;

  if (card.name === "Big Sacrifice") {
    const choice = prompt("Enter the name of the card in your Void you want to play:");
    if (!choice) return;

    await performAction("play_card", {
      cardId,
      voidCardName: choice
    });

    return;
  }

  if (card.name === "Black Hole") {
    const choice = prompt("Enter the name of the Bodyguard you want to Void:");
    if (!choice) return;

    await performAction("play_card", {
      cardId,
      targetCardName: choice
    });

    return;
  }

  await performAction("play_card", { cardId });
}

async function useAbility(cardId) {
  await performAction("ability", { cardId });
}

// =======================================
// CARD DISPLAY
// =======================================

function makeGameCard(card, options = {}) {
  const element = document.createElement("div");

  element.className = "game-card";

  if (card.t === "Tool") element.classList.add("tool");
  if (options.boss) element.classList.add("boss");
  if (options.selected) element.classList.add("selected");

  const turns = card.turnsLeft
    ? `<div class="muted">Frozen for ${escapeHtml(card.turnsLeft)} turns</div>`
    : "";

  const frozen = card.frozen
    ? `<div class="muted">FROZEN</div>`
    : "";

  const used = card.used
    ? `<div class="muted">USED</div>`
    : "";

  const abilityUsed = card.abilityUsedTurn
    ? `<div class="muted">ABILITY USED</div>`
    : "";

  element.innerHTML = `
    <div class="card-name">${escapeHtml(card.name)}</div>

    <div class="card-type">
      ${escapeHtml(card.t || (options.boss ? "Boss" : "Bodyguard"))}
    </div>

    <div class="card-stats">
      <div class="stat">
        <strong>${escapeHtml(card.p ?? "—")}</strong>
        <small>POWER</small>
      </div>

      <div class="stat">
        <strong>${escapeHtml(card.l)}</strong>
        <small>LEVEL</small>
      </div>
    </div>

    <div class="card-ability">
      ${escapeHtml(card.a || "No special ability.")}
    </div>

    ${turns}
    ${frozen}
    ${used}
    ${abilityUsed}

    <div class="card-footer">BLAMMO TCG</div>
  `;

  return element;
}

// =======================================
// RENDER GAME
// =======================================

function renderGame() {
  const area = document.getElementById("gameArea");

  if (!gameView) return;

  if (!gameView.started) {
    renderBossSelection(area);
    return;
  }

  const me = myPlayer();
  const enemy = enemyPlayer();
  const myTurn = isMyTurn();

  area.innerHTML = "";

  const board = document.createElement("div");
  board.className = "game-board";

  // GAME HEADER
  const header = document.createElement("div");
  header.className = "game-panel board-header";

  header.innerHTML = `
    <h2 style="text-align:center">BLAMMO BATTLE</h2>

    <div class="player-heading">
      <strong>ROOM: ${escapeHtml(roomCode)}</strong>
      <strong>ROUND ${escapeHtml(gameView.round)}</strong>
    </div>

    <div class="message">
      ${escapeHtml(gameView.message || "Game in progress.")}
    </div>

    <div style="text-align:center">
      ${
        gameView.gameOver
          ? `<h2>GAME OVER — ${escapeHtml(gameView.winner)} WINS!</h2>`
          : myTurn
            ? `<h2 style="color:#69e69b">YOUR TURN</h2>`
            : `<h2 style="color:#fca5a5">OPPONENT'S TURN</h2>`
      }
    </div>
  `;

  board.appendChild(header);

  // ENEMY
  const enemyPanel = document.createElement("div");
  enemyPanel.className = "game-panel enemy-panel";

  enemyPanel.innerHTML = `
    <div class="player-heading">
      <h2>OPPONENT</h2>
      <div class="hp">${escapeHtml(enemy.boss.name)}: ${escapeHtml(enemy.boss.hp)} HP</div>
    </div>

    <div class="muted">Opponent's deck: ${escapeHtml(enemy.deckCount)} cards</div>

    <h3 class="section-title">OPPONENT'S BODYGUARDS</h3>
  `;

  const enemyBattlefield = document.createElement("div");
  enemyBattlefield.className = "battlefield";
  const enemyBossCard = makeGameCard({ name: enemy.boss.name, p: enemy.boss.level, l: enemy.boss.level, a: `BOSS • ${enemy.boss.hp} HP` }, { boss: true });
  enemyBattlefield.appendChild(enemyBossCard);

  const enemyField = document.createElement("div");
  enemyField.className = "field";

  if (enemy.field.length === 0) {
    enemyField.innerHTML = '<p class="muted">No Bodyguards on the field.</p>';
  } else {
    enemy.field.forEach(card => {
      const cardElement = makeGameCard(card);

      if (myTurn && selectedAttackerId) {
        const attackButton = document.createElement("button");
        attackButton.textContent = "Attack this Bodyguard";

        attackButton.onclick = () => {
          attackBodyguard(selectedAttackerId, card.id);
        };

        cardElement.appendChild(attackButton);
      }

      enemyField.appendChild(cardElement);
    });
  }

  enemyBattlefield.appendChild(enemyField);
  enemyPanel.appendChild(enemyBattlefield);
  board.appendChild(enemyPanel);

  // TURN PANEL
  const turnPanel = document.createElement("div");
  turnPanel.className = "game-panel turn-panel";

  turnPanel.innerHTML = `
    <h2 style="text-align:center">YOUR TURN STATUS</h2>

    <div class="dice">
      ${gameView.rolled ? "🎲 " + escapeHtml(gameView.rollValue) : "🎲 ?"}
    </div>

    <p style="text-align:center">
      Level used: ${escapeHtml(gameView.spentThisTurn)}
      /
      ${escapeHtml(gameView.rollValue)}
    </p>

    <p style="text-align:center">
      Cards remaining this turn: ${escapeHtml(gameView.playsLeft)}
      / 2
    </p>

    <p style="text-align:center">
      Boss damage this turn: ${escapeHtml(gameView.bossDamageThisTurn)} / 1
    </p>

    <div class="action-row">
      <button id="rollButton">ROLL DICE</button>
      <button id="endTurnButton" class="secondary">END TURN</button>
    </div>
  `;

  board.appendChild(turnPanel);

  document.getElementById("rollButton").onclick = rollDice;
  document.getElementById("endTurnButton").onclick = endTurn;

  document.getElementById("rollButton").disabled =
    !myTurn || gameView.rolled || busy;

  document.getElementById("endTurnButton").disabled =
    !myTurn || !gameView.rolled || busy;

  // YOUR FIELD
  const myFieldPanel = document.createElement("div");
  myFieldPanel.className = "game-panel my-field-panel";

  myFieldPanel.innerHTML = `
    <div class="player-heading">
      <h2>YOUR FIELD</h2>
      <div class="hp">${escapeHtml(me.boss.name)}: ${escapeHtml(me.boss.hp)} HP</div>
    </div>

    <p class="muted">Your Bodyguards: ${me.field.length} / 3</p>
  `;

  const myBattlefield = document.createElement("div");
  myBattlefield.className = "battlefield";
  const myBossCard = makeGameCard({ name: me.boss.name, p: me.boss.level, l: me.boss.level, a: `BOSS • ${me.boss.hp} HP` }, { boss: true });
  myBattlefield.appendChild(myBossCard);

  const myField = document.createElement("div");
  myField.className = "field";

  if (me.field.length === 0) {
    myField.innerHTML = '<p class="muted">You have no Bodyguards on the field.</p>';
  } else {
    me.field.forEach(card => {
      const selected = selectedAttackerId === card.id;
      const cardElement = makeGameCard(card, { selected });

      const actions = document.createElement("div");
      actions.className = "card-actions";

      const selectButton = document.createElement("button");
      selectButton.textContent = selected
        ? "Cancel selection"
        : "Select attacker";

      selectButton.className = "secondary";

      selectButton.disabled =
        !myTurn ||
        !gameView.rolled ||
        card.used ||
        card.frozen > 0 ||
        busy;

      selectButton.onclick = () => selectAttacker(card.id);

      actions.appendChild(selectButton);

      if (["Dirt Golem", "Frankenstein", "Time Machine"].includes(card.name)) {
        const abilityButton = document.createElement("button");
        abilityButton.textContent = "USE ABILITY";
        abilityButton.className = "secondary";
        abilityButton.disabled = !myTurn || !gameView.rolled || card.abilityUsedTurn || card.frozen > 0 || busy;
        abilityButton.onclick = () => useAbility(card.id);
        actions.appendChild(abilityButton);
      }

      if (enemy.field.length === 0) {
        const bossButton = document.createElement("button");
        bossButton.textContent = "Attack Boss";

        bossButton.disabled =
          !myTurn ||
          !gameView.rolled ||
          card.used ||
          card.frozen > 0 ||
          gameView.round <= 1 ||
          gameView.bossDamageThisTurn >= 1 ||
          busy;

        bossButton.onclick = () => attackBoss(card.id);

        actions.appendChild(bossButton);
      }

      cardElement.appendChild(actions);
      myField.appendChild(cardElement);
    });
  }

  myBattlefield.appendChild(myField);
  myFieldPanel.appendChild(myBattlefield);
  board.appendChild(myFieldPanel);

  // YOUR HAND
  const handPanel = document.createElement("div");
  handPanel.className = "game-panel hand-panel";

  handPanel.innerHTML = `
    <h2>YOUR HAND</h2>
    <p class="muted">
      Playing a Bodyguard or Tool uses one of your two plays. Tools activate immediately.
    </p>
  `;

  const handGrid = document.createElement("div");
  handGrid.className = "hand-grid";

  (me.hand || []).forEach(card => {
    const cardElement = makeGameCard(card);
    const actions = document.createElement("div");
    actions.className = "card-actions";

    const playButton = document.createElement("button");

    playButton.textContent = card.t === "Tool" ? "USE TOOL" : "PLAY BODYGUARD";
    playButton.disabled =
      !myTurn ||
      !gameView.rolled ||
      gameView.playsLeft <= 0 ||
      (card.t !== "Tool" && me.field.length >= 3) ||
      gameView.spentThisTurn + card.l > gameView.rollValue ||
      (card.name === "Big Sacrifice" && (!me.void || me.void.length === 0 || me.field.length >= 3)) ||
      (card.name === "Black Hole" && me.field.length === 0) ||
      busy;
    playButton.onclick = () => playCard(card.id);

    actions.appendChild(playButton);
    cardElement.appendChild(actions);
    handGrid.appendChild(cardElement);
  });

  if (!me.hand || me.hand.length === 0) {
    handGrid.innerHTML = '<p class="muted">Your hand is empty.</p>';
  }

  handPanel.appendChild(handGrid);
  board.appendChild(handPanel);

  // VOID AND DECK
  const extraPanel = document.createElement("div");
  extraPanel.className = "game-panel board-extra";

  extraPanel.innerHTML = `
    <h3>YOUR DECK</h3>
    <p>${escapeHtml(me.deckCount)} cards remaining</p>

    <h3>YOUR VOID</h3>
    <p>${me.void.length ? me.void.map(c => escapeHtml(c.name)).join(", ") : "Your Void is empty."}</p>
    ${me.peekedCard ? `<p class="message">Frankenstein saw: ${escapeHtml(me.peekedCard.name)} (Level ${escapeHtml(me.peekedCard.l)}, Power ${escapeHtml(me.peekedCard.p ?? "—")})</p>` : ""}
  `;

  board.appendChild(extraPanel);

  if (gameView.gameOver) {
    const winnerPanel = document.createElement("div");
    winnerPanel.className = "game-panel";
    winnerPanel.innerHTML = `
      <h2 style="text-align:center">
        🏆 ${escapeHtml(gameView.winner)} WINS!
      </h2>
    `;
    board.appendChild(winnerPanel);
  }

  area.appendChild(board);
}

// =======================================
// BOSS SELECTION SCREEN
// =======================================

function renderBossSelection(area) {
  const chosen = gameView.choices || {};
  const myChoice = chosen[String(gameView.yourSeat)];

  area.innerHTML = `
    <div class="game-panel">
      <h2>CHOOSE YOUR BOSS</h2>
      <p>Pick your boss to begin the battle.</p>
      <div id="bossChoices"></div>
      <p class="muted">Waiting for both players to choose...</p>
    </div>
  `;

  const choices = document.getElementById("bossChoices");

  bosses.forEach(boss => {
    const button = document.createElement("button");

    button.innerHTML = `
      ${escapeHtml(boss[0])}<br>
      Level ${escapeHtml(boss[1])}<br>
      6 HP
    `;

    button.disabled = !!myChoice || busy;
    button.onclick = () => chooseBoss(boss[0]);

    choices.appendChild(button);
  });
}

// =======================================
// CARD GALLERY
// =======================================

function renderGallery() {
  const gallery = document.getElementById("cardGallery");

  const bodySection = document.createElement("div");
  bodySection.className = "card-grid";

  bodySection.innerHTML = '<h3 class="section-title">BODYGUARDS</h3>';

  cards.filter(card => card[1] !== null).forEach(card => {
    const element = makeGameCard({
      name: card[0],
      p: card[1],
      l: card[2],
      a: card[3],
      t: "Bodyguard"
    });

    bodySection.appendChild(element);
  });

  const toolSection = document.createElement("div");
  toolSection.className = "card-grid";

  toolSection.innerHTML = '<h3 class="section-title">TOOLS</h3>';

  cards.filter(card => card[1] === null).forEach(card => {
    const element = makeGameCard({
      name: card[0],
      p: card[1],
      l: card[2],
      a: card[3],
      t: "Tool"
    });

    toolSection.appendChild(element);
  });

  const bossSection = document.createElement("div");
  bossSection.className = "card-grid";

  bossSection.innerHTML = '<h3 class="section-title">BOSSES</h3>';

  bosses.forEach(boss => {
    const element = makeGameCard({
      name: boss[0],
      p: boss[1],
      l: boss[1],
      a: "Boss",
      t: "Boss"
    }, { boss: true });

    bossSection.appendChild(element);
  });

  gallery.replaceChildren(bodySection, toolSection, bossSection);
}

renderGallery();
</script>
</body>
</html>
